<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Vila Circuito</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Conceito: a placa-mãe é uma vila. O fundo verde tem pistas de cobre com eletrões a correr; cada temática é um bairro e o Bit, um chip com pernas, guia as crianças. */
:root{
  --board:#0fa37f; --board-deep:#0a7a60; --trace:#35c9a2; --gold:#ffd23f; --gold-deep:#e0a400;
  --ink:#172447; --paper:#ffffff; --soft:#eef3ff;
  --blue:#3f7bff; --blue-soft:#dbe6ff; --pink:#ff4f9a; --pink-soft:#ffe0ee; --violet:#7a4dff; --violet-soft:#e7dfff;
  --right:#14b86a; --right-soft:#d8f8e7; --wrong:#f0503e; --wrong-soft:#ffe3df;
  --f-display:"Baloo 2","Trebuchet MS",Verdana,sans-serif;
  --f-body:"Nunito","Trebuchet MS",Verdana,sans-serif;
}
html,body{height:100%}
body{background:var(--board);color:var(--ink);font-family:var(--f-body);font-weight:600;font-size:18px;line-height:1.4;overflow:hidden}
*{box-sizing:border-box}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:30}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--ink);color:var(--paper)}
#top .brand{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1;color:var(--gold);background:none;border:0;cursor:pointer;padding:0}
#top .sp{flex:1}
#top .brand,#top .ghost{white-space:nowrap}
@media (max-width:480px){#top:has(#back) .brand{display:none}}
.score{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.score svg{width:22px;height:22px}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:20px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:800;line-height:1.05;text-wrap:balance}
p{margin:0}
.on-board{color:var(--paper)}

.btn{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.1;color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:14px;padding:11px 20px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.white{background:var(--paper)}
.btn.small{font-size:16px;padding:6px 12px;box-shadow:0 3px 0 var(--ink);border-width:2px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:0 2px 0 var(--ink)}
:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
#top :focus-visible{outline-color:var(--gold)}
.ghost{background:none;border:2px solid var(--paper);color:var(--paper);border-radius:10px;font:inherit;font-weight:800;font-size:15px;padding:5px 11px;cursor:pointer}

/* Entrada */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.hero .bit{width:clamp(110px,18vw,170px)}
.logo{font-size:clamp(50px,9.5vw,92px);color:var(--paper);text-shadow:0 5px 0 var(--board-deep)}
.logo em{font-style:normal;color:var(--gold)}
.hero p{color:var(--paper);font-size:clamp(18px,2.4vw,23px);max-width:40ch}
.bairros{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.bairros>.bairro{grid-column:span 2}
.bairros>.bairro:nth-child(n+4){grid-column:span 3}
@media (max-width:760px){.bairros{grid-template-columns:minmax(0,1fr)}.bairros>.bairro,.bairros>.bairro:nth-child(n+4){grid-column:auto}}
.bairro{--c:var(--blue);--s:var(--blue-soft);text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);cursor:pointer;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .14s}
.bairro:hover{transform:translateY(-5px) rotate(-.6deg)}
.bairro .art{background:var(--s);padding:16px;display:flex;justify-content:center;gap:4px;border-bottom:3px solid var(--ink);min-height:136px;align-items:center}
.bairro .art svg{width:33%;max-width:96px;height:auto}
.bairro .txt{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
.bairro h2{font-size:28px;color:var(--c)}
.bairro p{font-size:17px}
.pips{display:flex;gap:6px;align-items:center;margin-top:auto;font-size:15px;font-weight:800}
.pips i{width:18px;height:18px;border-radius:50%;background:var(--soft);border:2px solid var(--ink)}
.pips i.on{background:var(--gold)}
.t-pink{--c:var(--pink);--s:var(--pink-soft)}
.t-violet{--c:var(--violet);--s:var(--violet-soft)}
.t-orange{--c:#d9560a;--s:#ffe8d2}
.t-teal{--c:#007f8c;--s:#d2f3f5}
.t-blue{--c:var(--blue);--s:var(--blue-soft)}
.foot{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;color:var(--paper);font-size:15px}

/* Temática */
.head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.head h2{font-size:clamp(32px,5.4vw,50px);color:var(--paper);text-shadow:0 3px 0 var(--board-deep)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}
.act{text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:16px;cursor:pointer;display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;transition:transform .14s}
.act:hover{transform:translateY(-4px)}
.act .ic{width:72px;height:72px;border-radius:16px;background:var(--s);display:grid;place-items:center}
.act .ic svg{width:54px;height:54px}
.act b{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.05;display:block}
.act span{font-size:16px;display:block}
.act .pts{font-weight:800;font-size:15px;color:var(--c);margin-top:3px}
.help{background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 16px;font-size:16px}
.help b{color:var(--gold);font-weight:800;user-select:all}

/* Bit a falar */
.talk{display:grid;grid-template-columns:82px minmax(0,1fr);gap:8px;align-items:center}
.talk .bit{width:82px}
.bubble{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:11px 15px;display:flex;flex-direction:column;gap:8px;min-width:0}
.bubble::before{content:"";position:absolute;left:-13px;top:50%;margin-top:-9px;border:9px solid transparent;border-left:0;border-right:13px solid var(--ink)}
.bubble p{font-size:clamp(18px,2.3vw,21px);font-weight:800;line-height:1.28}
.bubble.right{background:var(--right-soft)}
.bubble.wrong{background:var(--wrong-soft)}
.bubrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.say{display:none}
body.tts .say{display:inline-flex;align-items:center;gap:5px}
.say svg{width:17px;height:17px}

/* Área de jogo */
.stage{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.count{display:flex;gap:6px;flex-wrap:wrap}
.count i{width:16px;height:16px;border-radius:50%;background:var(--soft);border:2px solid var(--ink)}
.count i.ok{background:var(--right)}
.count i.no{background:var(--wrong)}
.count i.cur{background:var(--gold)}
.q{font-family:var(--f-display);font-weight:800;font-size:clamp(23px,3.4vw,31px);line-height:1.15}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.opt{font:inherit;font-weight:800;font-size:19px;line-height:1.2;color:var(--ink);background:var(--soft);border:3px solid var(--ink);border-radius:15px;padding:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:66px;box-shadow:0 4px 0 var(--ink);transition:transform .08s}
.opt:hover:not([disabled]){background:var(--blue-soft);transform:translateY(-2px)}
.opt svg{width:68px;height:68px}
.opt.text{text-align:left;align-items:flex-start}
.opts.six{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){.opts.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt.right{background:var(--right-soft);border-color:var(--right)}
.opt.wrong{background:var(--wrong-soft);border-color:var(--wrong)}
.opt.sel{background:var(--gold)}
.opt[disabled]{cursor:default;box-shadow:none;transform:translateY(4px)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

.belt{display:grid;grid-template-columns:1fr 112px 1fr;align-items:center;gap:6px;background:var(--pink-soft);border-radius:14px;padding:14px;overflow:hidden}
.belt .side{font-family:var(--f-display);font-weight:800;font-size:clamp(15px,2.6vw,21px);text-align:center;color:var(--pink);min-width:0}
.belt .pc svg{width:112px;height:112px;display:block}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;animation:drop .3s cubic-bezier(.3,1.5,.5,1)}
.item svg{width:clamp(110px,20vw,150px);height:clamp(110px,20vw,150px)}
.item b{font-family:var(--f-display);font-weight:800;font-size:28px;text-align:center;line-height:1.05}
@keyframes drop{from{transform:translateY(-26px) scale(.7)}}
.fly-in{animation:flyL .55s ease-in forwards}
.fly-out{animation:flyR .55s ease-in forwards}
.fly-both{animation:flyB .6s ease-in-out forwards}
@keyframes flyL{to{transform:translateX(-46vw) scale(.3)}}
@keyframes flyR{to{transform:translateX(46vw) scale(.3)}}
@keyframes flyB{50%{transform:scale(1.25) rotate(8deg)}}

/* Montar o computador */
.casewrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px}
@media (max-width:700px){.casewrap{grid-template-columns:minmax(0,1fr)}.case{aspect-ratio:1/1.05}}
.case{position:relative;aspect-ratio:1.42/1;width:100%;background:#26344f;border:5px solid var(--ink);border-radius:18px;overflow:hidden}
.mobo{position:absolute;left:6%;top:5%;right:6%;height:64%;background:var(--board);border:3px solid var(--ink);border-radius:9px;background-image:repeating-linear-gradient(90deg,#ffffff1c 0 2px,transparent 2px 22px),repeating-linear-gradient(0deg,#ffffff1c 0 2px,transparent 2px 22px)}
.mobo-l{position:absolute;left:8%;top:62.6%;font-size:12.5px;color:var(--paper);font-weight:800}
.slot{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;font-weight:800;font-size:clamp(12px,1.75vw,15px);line-height:1.08;text-align:center;color:var(--paper);background:#0a2b3bcc;border:3px dashed var(--gold);border-radius:10px;padding:3px;cursor:pointer;min-width:0}
.slot:hover{background:#17496a}
.slot.drop{background:var(--blue)}
.slot.full{background:var(--paper);color:var(--ink);border:3px solid var(--ink);cursor:default}
.slot.full svg{width:min(70%,58px);height:auto;flex:0 1 auto;min-height:0}
.slot.full span{font-size:clamp(10px,1.45vw,13px)}
.tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;align-content:start}
.piece{font:inherit;font-weight:800;font-size:15.5px;line-height:1.05;color:var(--ink);background:var(--soft);border:3px solid var(--ink);border-radius:12px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:grab;touch-action:none;user-select:none;box-shadow:0 3px 0 var(--ink)}
.piece svg{width:52px;height:52px}
.piece.sel{background:var(--gold)}
.piece.used{visibility:hidden}
.ghostp{position:fixed;z-index:40;pointer-events:none;background:var(--gold);transform:translate(-50%,-50%) rotate(-4deg);width:96px}
.led{position:absolute;right:5%;bottom:3%;width:15px;height:15px;border-radius:50%;background:#55627f;border:2px solid var(--ink)}
.case.power{box-shadow:0 0 34px 8px var(--gold)}
.case.power .led{background:#4bff9e;box-shadow:0 0 12px #4bff9e}
.case.power .blades{animation:spin .55s linear infinite;transform-origin:32px 32px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Pares */
.pairs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.pairs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.flip{aspect-ratio:1/1;border:0;padding:0;background:none;cursor:pointer;perspective:700px;font:inherit}
.flip .in{display:block;position:relative;width:100%;height:100%;transition:transform .32s;transform-style:preserve-3d}
.flip.up .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border:3px solid var(--ink);border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;font-weight:800;line-height:1.08;font-size:clamp(13px,1.9vw,17px);text-align:center;color:var(--ink)}
.face.front{background:var(--blue);background-image:repeating-linear-gradient(45deg,#ffffff22 0 6px,transparent 6px 14px)}
.face.front svg{width:48%;height:48%}
.face.back{background:var(--blue-soft);transform:rotateY(180deg)}
.face.back svg{width:58%;height:58%;min-height:0}
.flip.done .face.back{background:var(--right-soft);border-color:var(--right)}

/* Histórias */
.track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.track{grid-template-columns:minmax(0,1fr)}}
.spot{border:3px dashed var(--pink);border-radius:14px;padding:9px;min-height:112px;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;text-align:center;font-weight:800;background:var(--pink-soft)}
.spot small{font-family:var(--f-display);font-weight:800;color:var(--pink);font-size:18px}
.spot.full{border-style:solid;border-color:var(--right);background:var(--right-soft)}
.spot svg{width:46px;height:46px}

/* Forte */
.forge{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:700px){.forge{grid-template-columns:minmax(0,1fr)}}
.pw{min-height:60px;background:var(--ink);color:var(--gold);border-radius:12px;padding:10px 14px;font-weight:800;font-size:clamp(20px,3vw,26px);overflow-wrap:anywhere;display:flex;align-items:center}
.pw.empty{color:#93a2c9;font-size:17px}
.tiles{display:flex;gap:8px;flex-wrap:wrap}
.tile{font:inherit;font-weight:800;font-size:18px;color:var(--ink);background:var(--violet-soft);border:3px solid var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.tile.trap{background:var(--soft);font-size:16px}
.tile[disabled]{opacity:.4;cursor:default}
ul.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:17px}
ul.rules li{display:flex;gap:8px;align-items:center}
ul.rules i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--soft);border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--paper);font-weight:800}
ul.rules li.ok i{background:var(--right)}
.fort svg{width:100%;height:auto;display:block}
.fort rect,.fort path{transition:opacity .3s}

/* Mensagens */
.phone{align-self:center;width:100%;max-width:440px;background:var(--ink);border-radius:26px;padding:14px 12px 18px;display:flex;flex-direction:column;gap:9px}
.phone header{color:var(--paper);font-weight:800;font-size:16px;text-align:center}
.msg{background:var(--paper);border-radius:14px;padding:13px;font-size:20px;line-height:1.5;font-weight:600}
.seg{font:inherit;line-height:inherit;color:inherit;background:var(--soft);border:0;border-radius:6px;padding:1px 5px;cursor:pointer;margin:1px 0}
.seg:hover{background:var(--gold)}
.seg.found{background:var(--wrong);color:var(--paper);cursor:default}
.seg.fine{background:var(--right-soft);cursor:default}


/* Ergonomia */
.ergo{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.ergo{grid-template-columns:minmax(0,1fr)}}
.ergo svg,.spot-e svg{width:100%;height:auto;display:block;background:#eaf2ff;border-radius:12px}
.ctl{display:flex;flex-direction:column;gap:2px}
.ctl label{display:flex;justify-content:space-between;font-weight:800;font-size:16px}
.ctl input{width:100%;accent-color:var(--blue);height:26px}
.ctl output{font-variant-numeric:tabular-nums}
.tgl{font:inherit;font-weight:800;font-size:16px;border:3px solid var(--ink);border-radius:12px;background:var(--soft);padding:8px 10px;cursor:pointer;color:var(--ink);text-align:left}
.tgl[aria-pressed=true]{background:var(--right-soft);border-color:var(--right)}
.ruleg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:16px}
.ruleg li{display:flex;gap:8px;align-items:center}
.ruleg i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--wrong);color:#fff;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800}
.ruleg li.ok i{background:var(--right)}
.ehit{cursor:pointer;fill:transparent}
.ehit.found{fill:#14b86a55;stroke:#14b86a;stroke-width:4}
.stretch{display:grid;place-items:center}
.stretch svg{width:min(100%,230px);height:auto}
.a1 .ar{animation:shr 1.4s ease-in-out infinite}
@keyframes shr{50%{transform:translateY(-10px)}}
.a2 .ar{animation:upa 2s ease-in-out infinite}
@keyframes upa{50%{transform:translateY(-34px)}}
.a3 .ey{animation:lookf 2.4s ease-in-out infinite}
@keyframes lookf{50%{transform:translateX(5px)}}
.a4 .hd{animation:hnd 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes hnd{50%{transform:scale(1.6)}}
.bar-t{height:14px;background:var(--soft);border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.bar-t i{display:block;height:100%;width:0;background:var(--gold)}
/* Teclado português */
.kb{display:flex;flex-direction:column;gap:3px;background:var(--ink);padding:6px;border-radius:12px;width:100%}
.kr{display:flex;gap:3px}
.k{flex:var(--w,1) 1 0;min-width:0;height:clamp(32px,4.7vw,48px);border:0;border-radius:6px;background:var(--fc,#e8edf8);color:var(--ink);font-family:var(--f-body);font-weight:800;font-size:clamp(11px,1.75vw,18px);position:relative;display:grid;place-items:center;padding:0;cursor:pointer;line-height:1;touch-action:manipulation}
.k.mod{background:#c5cfe4;font-size:clamp(8px,1.15vw,12px);cursor:default}
.k.mod.tap{cursor:pointer}
.k.on{background:#fff;outline:2px solid var(--gold)}
.k .sh,.k .ag{position:absolute;font-size:.68em;font-weight:800}
.k .sh{left:3px;top:2px}.k .bs{position:absolute;left:3px;bottom:2px}.k .ag{right:3px;bottom:2px;color:#a01060}
.k.bump::after{content:"";position:absolute;bottom:4px;left:50%;width:30%;height:3px;margin-left:-15%;background:var(--ink);border-radius:2px}
.k.next{background:var(--gold);box-shadow:0 0 0 3px #fff;z-index:2;animation:kpulse .8s infinite}
@keyframes kpulse{50%{box-shadow:0 0 0 5px #ffffff88}}
.k.hit{background:var(--right)}.k.bad{background:var(--wrong)}
.tx{font-family:ui-monospace,Consolas,"Courier New",monospace;font-weight:700;font-size:clamp(26px,4.6vw,42px);line-height:1.2;text-align:center;overflow-wrap:anywhere;min-height:1.3em;white-space:pre-wrap}
.tx .d{color:var(--right)}.tx .c{background:var(--gold);border-radius:5px;padding-inline:3px}.tx .t{color:#9aa7c7}
.tx .c.sp{outline:3px solid var(--ink);outline-offset:-3px}
.thint{text-align:center;font-weight:800;font-size:17px;min-height:1.4em}
.hands{display:flex;justify-content:center}
.hands svg{width:min(100%,380px);height:auto}
.tmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800;font-size:16px}
.vis{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}

/* --- guardar progresso neste browser --- */
const KEY="vila-circuito-v1",mem={};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const S0=(()=>{try{return JSON.parse(store.get(KEY))||{}}catch(e){return{}}})();
const S=Object.assign({teams:[],current:null,sound:true,prof:{pin:null,teams:[]},exam:{on:false,max:1}},S0);delete S.exam;if(!S.keyMax)S.keyMax=1;
if(S0.best&&Object.keys(S0.best).length&&!S.teams.length)S.legacy=S0.best;
delete S.best;if(!S.prof||!Array.isArray(S.prof.teams))S.prof={pin:null,teams:[]};
const team=()=>S.teams.find(t=>t.id===S.current)||null;
Object.defineProperty(S,"best",{get(){const t=team();return t?t.best:{}},enumerable:false});
const save=()=>store.set(KEY,JSON.stringify(S));
const totalPts=()=>Object.values(S.best).reduce((a,b)=>a+b,0);

/* --- modo em linha: o jogo publicado com Google Apps Script guarda tudo na Folha de cálculo do professor --- */
const ONLINE=(()=>{try{return typeof google!=="undefined"&&!!(google.script&&google.script.run)}catch(e){return false}})();
const NET={ok:null};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function rpc(fn,...args){return new Promise((res,rej)=>{if(!ONLINE){rej(new Error("sem servidor"));return}
 const tm=setTimeout(()=>rej(new Error("tempo")),30000);
 google.script.run.withSuccessHandler(v=>{clearTimeout(tm);try{res(typeof v==="string"?JSON.parse(v):v)}catch(e){rej(e)}}).withFailureHandler(e=>{clearTimeout(tm);rej(e)})[fn](...args)})}
function setNet(v){NET.ok=v;const d=$("#net");if(!d)return;d.className="net "+(v===false?"off":v?"on":"");d.textContent=v===false?"Sem ligação":v?"Em linha":"A ligar";d.title=v===false?"Os resultados ficam guardados neste computador e são enviados quando a ligação voltar.":"Os resultados vão diretamente para o professor."}
const sig=()=>JSON.stringify(S.teams.map(t=>[t.id,t.name,t.turma,t.ic,t.col,t.best,(t.members||[]).map(m=>m.n+m.t+(m.out?1:0))]));
function mergeList(list){const ids=new Set(list.map(t=>t.id));
 S.teams=S.teams.filter(t=>ids.has(t.id)||(t.dirty&&!t.sv));
 list.forEach(st=>{const o=S.teams.find(t=>t.id===st.id);if(!o){S.teams.push({...st,best:st.best||{},att:st.att||{},members:st.members||[],play:st.play||{},log:[],sv:1});return}
  const best={...(st.best||{})};for(const k in o.best)best[k]=Math.max(best[k]??0,o.best[k]);
  if(o.dirty){o.best=best;o.sv=1;return}
  Object.assign(o,st,{best,att:st.att||{},members:st.members||[],play:st.play||{},log:o.log||[],sv:1})});
 if(S.current&&!team())S.current=null}
async function pull(){if(!ONLINE)return false;const before=sig();try{const r=await rpc("vcList");mergeList(r.teams||[]);setNet(true);save();return sig()!==before}catch(e){setNet(false);return false}}
let flushing=false;
function pushTeam(t){if(!ONLINE||!t)return;t.dirty=1;t.ver=(t.ver||0)+1;save();flush()}
async function flush(){if(!ONLINE||flushing)return;flushing=true;let fail=false;
 try{for(let pass=0;pass<3;pass++){const todo=S.teams.filter(t=>t.dirty);if(!todo.length)break;
  for(const t of todo){const v=t.ver,sent=new Set(t.log.filter(l=>!l.s).map(l=>l.i));
   let r;try{r=await rpc("vcSync",JSON.stringify({id:t.id,name:t.name,turma:t.turma,ic:t.ic,col:t.col,members:t.members,play:t.play,best:t.best,made:t.made,log:t.log.filter(l=>sent.has(l.i))}))}catch(e){fail=true;break}
   if(r.deleted){S.teams=S.teams.filter(x=>x!==t);if(S.current===t.id)S.current=null;continue}
   if(!r.team)continue;
   t.log=t.log.filter(l=>!sent.has(l.i));t.sv=1;
   const best={...r.team.best};for(const k in t.best)best[k]=Math.max(best[k]??0,t.best[k]);t.best=best;t.att=r.team.att||t.att;
   if(t.ver===v&&!t.log.length)delete t.dirty}
  if(fail)break}}
 finally{flushing=false;save();setNet(!fail)}}

/* --- som --- */
let ac=null;
function tone(f,d,at=0,type="triangle",v=.13){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+at;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}

/* --- fundo: pistas de cobre da placa --- */
(()=>{
  const c=$("#bg"),g=c.getContext("2d");let W,H,paths=[],last=0;
  function build(){
    const D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);
    paths=[];const step=38,n=Math.round(W*H/26000);
    for(let i=0;i<n;i++){
      let x=Math.round(Math.random()*W/step)*step,y=Math.round(Math.random()*H/step)*step;const p=[[x,y]];let d=Math.random()<.5?0:1;
      for(let s=0;s<3+Math.floor(Math.random()*4);s++){const len=step*(2+Math.floor(Math.random()*5))*(Math.random()<.5?-1:1);if(d===0)x+=len;else y+=len;p.push([x,y]);d=1-d}
      let L=0;for(let k=1;k<p.length;k++)L+=Math.abs(p[k][0]-p[k-1][0])+Math.abs(p[k][1]-p[k-1][1]);
      paths.push({p,L,o:Math.random(),v:.05+Math.random()*.1});
    }
    draw(performance.now());
  }
  function at(q,d){for(let k=1;k<q.p.length;k++){const a=q.p[k-1],b=q.p[k],s=Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1]);if(d<=s){const t=d/s;return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}d-=s}return q.p[q.p.length-1]}
  function draw(now){
    g.fillStyle="#0fa37f";g.fillRect(0,0,W,H);g.lineWidth=4;g.lineJoin="round";g.strokeStyle="#35c9a2";g.fillStyle="#35c9a2";
    paths.forEach(q=>{g.beginPath();q.p.forEach((a,k)=>k?g.lineTo(a[0],a[1]):g.moveTo(a[0],a[1]));g.stroke();[q.p[0],q.p[q.p.length-1]].forEach(a=>{g.beginPath();g.arc(a[0],a[1],7,0,6.3);g.fill()})});
    g.fillStyle="#ffd23f";paths.forEach(q=>{const[x,y]=at(q,((q.o+now/1000*q.v)%1)*q.L);g.beginPath();g.arc(x,y,4.5,0,6.3);g.fill()});
  }
  function loop(n){requestAnimationFrame(loop);if(reduced||n-last<40)return;last=n;draw(n)}
  addEventListener("resize",build);build();requestAnimationFrame(loop);
})();
/* --- confetes --- */

  const COL=["#ffd23f","#ff4f9a","#3f7bff","#7a4dff","#ffffff"];

  return()=>{if(reduced)return;c.width=innerWidth;c.height=innerHeight;for(let i=0;i<130;i++)P.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*12-2,a:Math.random()*6,c:COL[i%5]});if(!run){run=true;step()}};
})();

/* avaliação: métricas a partir do registo de tentativas (o modo avaliação só existe no modo ficheiro) */
const tries=(t,id)=>(t.log||[]).filter(l=>l.a===id);
const MET={best:"Melhor pontuação",first:"1.ª tentativa",mean:"Média das tentativas",exam:"Avaliação"};
function metric(t,id,k){if(k==="best")return t.best[id]??null;const L=tries(t,id);if(k==="exam"){const X=L.filter(l=>l.x);return X.length?Math.max(...X.map(l=>l.p)):null}if(!L.length)return null;if(k==="first")return L[0].p;return Math.round(L.reduce((a,l)=>a+l.p,0)/L.length)}
/* chave de avaliação: o professor cria-a, vale só no dia em que foi criada e só neste jogo; cada equipa escreve-a (só no modo ficheiro) */
const KA="23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
const dayN=()=>{const d=new Date();return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,0,1))/864e5)};
const kEnc=n=>[Math.floor(n/1024)%32,Math.floor(n/32)%32,n%32].map(i=>KA[i]).join("");
const kChk=b=>{const h=hash("exam:"+b);return KA[parseInt(h.slice(0,2),36)%32]+KA[parseInt(h.slice(2,4),36)%32]};
function makeKey(max){const b=kEnc(dayN()*3+(max-1));return "AV-"+b+kChk(b)}
function readKey(k){const v=String(k).toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/^AV/,"").replace(/0/g,"O");if(v.length!==5||[...v].some(c=>!KA.includes(c)))return null;const b=v.slice(0,3);if(kChk(b)!==v.slice(3))return null;const n=b.split("").reduce((a,c)=>a*32+KA.indexOf(c),0);return{id:n,day:Math.floor(n/3),max:n%3+1}}
const exOf=t=>{if(typeof ONLINE!=="undefined"&&ONLINE)return null;t=t||team();return t&&t.ex&&t.ex.day===dayN()?t.ex:null};
const examOn=t=>!!exOf(t);
const examMax=t=>exOf(t)?exOf(t).max:1;
const exUsed=(t,id)=>{const e=exOf(t);return e?tries(t,id).filter(l=>l.x===e.id).length:0};
const examLeft=(t,id)=>exOf(t)?Math.max(0,exOf(t).max-exUsed(t,id)):Infinity;
const examTxt=()=>`Modo avaliação: cada jogo só pode ser jogado ${examMax()===1?"uma vez":examMax()+" vezes"}. ${examMax()===1?"Essa tentativa conta para a avaliação.":"Conta a melhor dessas tentativas."} Pensem bem antes de responder!`;

  const d=themeDone("comp"),e=themeDone("per"),f=themeDone("seg"),g2=themeDone("erg"),h2=themeDone("dig");
  const mouth={happy:'<path d="M46 73c6 9 22 9 28 0" fill="none" stroke="#172447" stroke-width="5" stroke-linecap="round"/>',
    wow:'<ellipse cx="60" cy="76" rx="8" ry="10" fill="#172447"/>',
    oops:'<path d="M46 80c8-7 20-7 28 0" fill="none" stroke="#172447" stroke-width="5" stroke-linecap="round"/>'}[mood];
  const pins=[34,52,70,88].map(v=>`<rect x="${v-3}" y="20" width="7" height="12" fill="#e0a400"/><rect x="${v-3}" y="104" width="7" height="12" fill="#e0a400"/><rect x="14" y="${v-3}" width="12" height="7" fill="#e0a400"/><rect x="96" y="${v-3}" width="12" height="7" fill="#e0a400"/>`).join("");

  ${f?'<g transform="translate(78 74) scale(.65)"><path d="M32 5 54 13v18c0 14-9 23-22 28C19 54 10 45 10 31V13z" fill="#7a4dff" stroke="#172447" stroke-width="4"/><path d="m21 32 8 8 14-16" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>':""}
  ${g2?'<g fill="none" stroke="#d9560a" stroke-width="4"><circle cx="46" cy="56" r="13"/><circle cx="74" cy="56" r="13"/><path d="M59 56h2"/></g>':""}

function choiceGame(act,cfg){
  const items=cfg.items,n=items.length;let k=0,marks=[],okc=0;
  frame(act,cfg.intro,`<div class="stage" id="stg"></div>`);
  function show(){
    const it=items[k];
    $("#stg").innerHTML=`${dots(n,marks,k)}${cfg.top(it)}<div class="opts" id="op">${cfg.opts(it).map(o=>`<button class="opt ${cfg.left?"text":""}" data-v="${o.v}">${o.icon?icon(o.icon):""}${o.l}</button>`).join("")}</div>`;
    if(k>0||!cfg.keepIntro)if(k>0)say(cfg.prompt||cfg.intro);
    $$("#op .opt").forEach(b=>b.onclick=()=>pick(b));
  }
  function pick(b){
    const it=items[k],right=cfg.answer(it),ok=b.dataset.v===String(right);
    $$("#op .opt").forEach(x=>{x.disabled=true;if(x.dataset.v===String(right))x.classList.add("right")});
    if(!ok)b.classList.add("wrong");
    marks[k]=ok?1:0;if(ok){okc++;sfx.ok()}else sfx.no();
    if(cfg.anim)cfg.anim(it);
    const pre=ok?take(["Boa!","Muito bem!","Certo!","Isso mesmo!"],1)[0]:"Quase!";
    say(`${pre} ${cfg.why(it)}`,ok?"right":"wrong",k<n-1?"Continuar":"Ver os pontos",()=>{k++;if(k<n)show();else finish(act,Math.round(okc/n*100),`Acertaste ${okc} de ${n}.`)});
  }
  show();
}
