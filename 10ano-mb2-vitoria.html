html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:16.5px;line-height:1.5;overflow:hidden}
#fxbg{position:fixed;inset:0;width:100%;height:100%;display:block}
#fxtop{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:50}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--hud);color:var(--hud-fg)}
#hud[hidden]{display:none}
.hud-team{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 150px}
.hud-team b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.hud-pts{font-family:var(--f-m);white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--hud-acc)}
.hud-nav{display:flex;gap:6px;flex-wrap:wrap}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:20px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.narrow{max-width:640px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--f-d)}
p{margin:0}
.eyebrow{font-family:var(--f-m);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--eyebrow)}
.lead{max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{position:relative;background:var(--panel);color:var(--panel-fg);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel .muted{color:var(--panel-muted)}
.btn{font-family:var(--f-b);font-weight:700;font-size:16px;line-height:1.15;color:var(--acc-fg);background:var(--acc);border:0;padding:11px 18px;cursor:pointer;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px)}
.btn.alt{background:var(--alt);color:var(--alt-fg)}
.btn.mini{padding:6px 11px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

  if(cfg.sec)stop=countdown(cfg.sec,f=>{const t=$("#tb");if(t)t.style.width=f*100+"%"},()=>pick(null));
 }
 function pick(b){
  const f=stop?stop():1,it=cfg.items[k],right=String(cfg.answer(it)),ok=!!b&&b.dataset.v===right;
  $$("#ops .opt",host).forEach(x=>{x.disabled=true;if(x.dataset.v===right)x.classList.add("right")});if(b&&!ok)b.classList.add("wrong");
  marks[k]=ok?1:0;if(ok){okc++;got+=each*(cfg.sec?.7+.3*f:1);sfx.ok()}else sfx.no();
  cfg.addPts&&cfg.addPts(got);

  afterFb(()=>{k++;if(k<n)show();else cfg.onDone(got,okc)});
 }
 show();
}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};

  [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,0,2],[12,0x21,2],[14,crc,4],[18,d.length,4],[22,d.length,4],[26,nm.length,2],[28,0,2]].forEach(([o,v,s])=>s===4?h.setUint32(o,v,true):h.setUint16(o,v,true));
