<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Operação Farol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@300;400;600;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Conceito: uma noite no Cabo da Roca. O mar animado fica sempre atrás; cada nível acende uma lente do farol e os painéis são placas de latão de um instrumento náutico. */
:root{
  color-scheme:dark;
  --abyss:#0a1140; --hull:#121c5c; --hull-2:#1b2a7a; --hull-deep:#060a2b;
  --flare:#ffc23d; --flare-deep:#d9820f; --coral:#ff5a78; --coral-deep:#b02448;
  --kelp:#2ee6b0; --kelp-deep:#0e9673; --foam:#eef6ff; --mist:#a9bce6; --line:#ffffff24;
  --f-display:"Bungee","Arial Black",Impact,sans-serif;
  --f-body:"Lexend","Trebuchet MS",Verdana,sans-serif;
  --f-data:"DM Mono",ui-monospace,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--abyss);color:var(--foam);font-family:var(--f-body);font-weight:300;font-size:16px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
#sea{position:fixed;inset:0;width:100%;height:100%;display:block}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#060a2bcc;border-bottom:2px solid var(--line)}
#hud[hidden]{display:none}
.hud-team{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 160px}
.hud-team b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-pts{font-family:var(--f-data);color:var(--flare);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-nav{display:flex;gap:6px;flex-wrap:wrap}
#view.dim{background:#0a114070}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1020px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4.6vw,42px);line-height:1.05;color:var(--foam)}
h3{font-weight:800;font-size:19px;line-height:1.25}
p{margin:0}
.eyebrow{font-family:var(--f-data);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--flare)}
.lead{font-size:17px;max-width:66ch;color:var(--foam)}
.muted{color:var(--mist)}
.small{font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* Placa de latão: rebites nos quatro cantos */
.plate{position:relative;background:#121c5cf2;border:2px solid var(--line);border-radius:5px;padding:20px;box-shadow:0 7px 0 var(--hull-deep);display:flex;flex-direction:column;gap:14px;min-width:0}
.plate::before{content:"";position:absolute;inset:6px;pointer-events:none;
  background:
   radial-gradient(circle,var(--flare) 0 2px,transparent 2.6px) 0 0/6px 6px no-repeat,
   radial-gradient(circle,var(--flare) 0 2px,transparent 2.6px) 100% 0/6px 6px no-repeat,
   radial-gradient(circle,var(--flare) 0 2px,transparent 2.6px) 0 100%/6px 6px no-repeat,
   radial-gradient(circle,var(--flare) 0 2px,transparent 2.6px) 100% 100%/6px 6px no-repeat;opacity:.75}

.btn{font-family:var(--f-body);font-weight:800;font-size:16px;color:var(--hull-deep);background:var(--flare);border:0;border-radius:5px;padding:12px 20px;cursor:pointer;box-shadow:0 5px 0 var(--flare-deep);transition:transform .08s,box-shadow .08s,filter .15s;position:relative}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--flare-deep)}
.btn.ghost{background:var(--hull-2);color:var(--foam);box-shadow:0 5px 0 var(--hull-deep)}
.btn.good{background:var(--kelp);box-shadow:0 5px 0 var(--kelp-deep)}
.btn.bad{background:var(--coral);box-shadow:0 5px 0 var(--coral-deep);color:#fff}
.btn.mini{padding:7px 11px;font-size:14px;box-shadow:0 3px 0 var(--hull-deep);font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:saturate(.4)}
:focus-visible{outline:3px solid var(--foam);outline-offset:2px}
input[type=text],textarea{width:100%;font:inherit;font-weight:400;color:var(--foam);background:var(--hull-deep);border:2px solid var(--line);border-radius:5px;padding:11px 12px}
textarea{font-family:var(--f-data);font-size:13px;min-height:90px;resize:vertical}

/* Ecrã inicial */
.title{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:20px;max-width:1020px;margin-inline:auto}
.logo{display:flex;flex-direction:column;line-height:.88}
.logo small{font-family:var(--f-display);font-size:clamp(24px,5.2vw,50px);color:var(--foam);letter-spacing:.04em}
.logo strong{font-family:var(--f-display);font-weight:400;font-size:clamp(82px,19vw,196px);letter-spacing:-.01em;background:linear-gradient(100deg,#fff2c4 0%,var(--flare) 38%,#ff8a3d 62%,var(--coral) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 7px 0 var(--hull-deep))}
.pitch{max-width:44ch;font-size:clamp(17px,2.2vw,21px);font-weight:400;text-shadow:0 2px 10px var(--hull-deep)}

@media (max-width:700px){.title{justify-content:flex-start;padding-top:5vh}#view.dim{background:#0a1140c4}th,td{padding:6px 4px;font-size:13px}}

/* Mapa */
.route{position:relative;width:100%}
.route svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.buoy{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:4px solid var(--foam);background:radial-gradient(circle at 35% 30%,#ff8fa3,var(--coral) 55%,var(--coral-deep));color:#fff;font-family:var(--f-display);font-size:28px;cursor:pointer;box-shadow:0 6px 0 var(--hull-deep);display:grid;place-items:center;transition:transform .15s;padding:0}
.buoy:hover:not([disabled]){transform:scale(1.09)}
.buoy.done{background:radial-gradient(circle at 35% 30%,#fff0bd,var(--flare) 55%,var(--flare-deep));color:var(--hull-deep)}
.buoy.next{animation:pulse 1.5s infinite}
.buoy[disabled]{background:var(--hull-2);border-color:var(--line);color:var(--mist);cursor:not-allowed}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 var(--hull-deep),0 0 0 0 #ffc23daa}50%{box-shadow:0 6px 0 var(--hull-deep),0 0 0 16px #ffc23d00}}
.tag{position:absolute;text-shadow:0 1px 6px var(--hull-deep);line-height:1.15;min-width:0}
.tag b{font-weight:800;font-size:15px;display:block}
.tag span.c{font-size:12.5px;color:var(--foam);display:block}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars svg{width:15px;height:15px}

/* Componentes de nível */
.lvtop{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.lvscore{font-family:var(--f-data);font-size:30px;color:var(--flare);font-variant-numeric:tabular-nums;line-height:1}
.lvscore small{display:block;font-size:12px;letter-spacing:.12em;color:var(--mist);text-transform:uppercase;margin-bottom:5px}
.timer{height:10px;background:var(--hull-deep);border-radius:5px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--coral),var(--flare) 40%,var(--kelp))}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--hull-deep);border:2px solid var(--line)}
.dots i.ok{background:var(--kelp);border-color:var(--kelp)}
.dots i.no{background:var(--coral);border-color:var(--coral)}
.dots i.cur{border-color:var(--flare)}
.card{font-size:clamp(20px,3vw,27px);font-weight:600;line-height:1.3;min-height:3.6em;display:flex;align-items:center}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.choices .btn{min-height:62px;font-size:17px}
.choices.four{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.choices.four{grid-template-columns:minmax(0,1fr)}}
.fb{padding:14px 16px;border-radius:5px;border:2px solid;display:flex;flex-direction:column;gap:10px;animation:rise .22s ease-out}
.fb.ok{border-color:var(--kelp);background:#2ee6b01f}
.fb.no{border-color:var(--coral);background:#ff5a781f}
.fb b{font-weight:800}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}}
canvas.game{width:100%;height:auto;display:block;border-radius:5px;background:var(--hull-deep);cursor:crosshair;touch-action:manipulation}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.stat{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-data);font-size:15px;font-variant-numeric:tabular-nums}
.cams{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.cam{display:flex;flex-direction:column;gap:8px;min-width:0}
.cam svg{width:100%;height:auto;border-radius:5px;display:block}
input[type=range]{width:100%;accent-color:var(--flare);height:26px}
.bar{height:22px;background:var(--hull-deep);border-radius:4px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--kelp);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar i.warn{background:var(--flare)}
.bar i.crit{background:var(--coral)}
.neuron svg{width:100%;height:auto;display:block}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--mist);text-align:center;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{text-align:center;padding:6px 8px;border-bottom:1px solid var(--line);font-family:var(--f-data)}
tr.pick{cursor:pointer}
tr.pick:hover td{background:#ffffff0d}
tr.sel td{background:#ffc23d26}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepper output{font-family:var(--f-data);font-size:20px;min-width:2.2em;text-align:center;color:var(--flare)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font:inherit;font-weight:600;font-size:14.5px;color:var(--foam);background:var(--hull-deep);border:2px solid var(--line);border-radius:5px;padding:7px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.pill[aria-pressed=true]{background:var(--flare);border-color:var(--flare);color:var(--hull-deep)}
.opt-title{font-weight:600;font-size:15px}
.wbars{display:flex;flex-direction:column;gap:7px}
.wbar{display:grid;grid-template-columns:96px 1fr 50px;gap:8px;align-items:center;font-size:15px}
.wbar span:last-child{font-family:var(--f-data);text-align:right}
.phrase{font-size:clamp(24px,4vw,36px);font-weight:800}
.phrase u{text-decoration:none;color:var(--flare);border-bottom:4px dashed var(--flare);padding-inline:.4em}
.sent{display:block;width:100%;text-align:left;font:inherit;font-size:17px;font-weight:400;color:var(--foam);background:var(--hull-deep);border:2px solid var(--line);border-radius:5px;padding:12px 14px;cursor:pointer}
.sent:hover:not([disabled]){border-color:var(--flare)}
.sent.right{border-color:var(--kelp);background:#2ee6b026}
.sent.wrong{border-color:var(--coral);background:#ff5a7826}
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px}
.tier{border:0;color:var(--hull-deep);font-family:var(--f-body);font-weight:800;font-size:15px;line-height:1.15;cursor:pointer;height:62px;display:flex;align-items:center;justify-content:center;text-align:center;padding-inline:15%;transition:filter .15s,transform .1s}
.tier:hover:not([disabled]){filter:brightness(1.15);transform:scale(1.02)}
.tier[disabled]{cursor:default}
.t1{width:46%;background:var(--coral);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);color:#fff;padding-inline:20%}
.t2{width:66%;background:#ff9a4a;clip-path:polygon(13% 0,87% 0,100% 100%,0 100%)}
.t3{width:84%;background:var(--flare);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%)}
.t4{width:100%;background:var(--kelp);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
@media (max-width:520px){.t1{width:62%;font-size:13px;padding-inline:17%}.t2{width:76%}.t3{width:90%}}
.ships{display:flex;gap:4px;flex-wrap:wrap}
.ships svg{width:24px;height:16px}

input[type=password],select{font:inherit;font-weight:400;color:var(--foam);background:var(--hull-deep);border:2px solid var(--line);border-radius:5px;padding:9px 11px;width:100%}
select{width:auto;padding:6px 9px}
.mlist2{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:28px minmax(0,2fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.mi{width:28px;height:28px;border-radius:50%;background:var(--flare);color:var(--hull-deep);display:grid;place-items:center;font-weight:800;font-family:var(--f-data)}
@media (max-width:520px){.mrow{grid-template-columns:28px minmax(0,1fr) 84px}.mrow .btn{grid-column:2/-1;justify-self:start}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-weight:600;font-size:16px;border:2px solid var(--line);border-radius:30px;padding:7px 15px;background:var(--hull-deep);color:var(--foam);cursor:pointer}
.chip[aria-pressed=true]{background:var(--flare);border-color:var(--flare);color:var(--hull-deep)}
.chip[aria-pressed=true]::before{content:"✓ "}
.pgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;font-size:14px;border:2px solid var(--line);border-radius:30px;background:none;color:var(--foam);padding:5px 12px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--flare);border-color:var(--flare);color:var(--hull-deep)}
table.pt td,table.pt th{text-align:left;white-space:nowrap}
table.pt td.n{text-align:center;font-family:var(--f-data)}table.pt small{color:var(--mist);font-size:12px}
table.pt td.wr{white-space:normal;min-width:150px;font-family:var(--f-body);font-size:14px}
table.pt tr.pick{cursor:pointer}table.pt tr.pick:hover td{background:#ffffff0d}table.pt tr.sel td{background:#ffc23d26}
.tn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-family:var(--f-body)}
.path{border:2px solid var(--flare);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--hull-deep)}
.mem3{display:flex;flex-wrap:wrap;gap:6px}.mem3 span{background:var(--hull-2);border-radius:6px;padding:4px 9px;font-size:14px}.mem3 span.off{opacity:.5}
ol.tl2{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ol.tl2 li{display:grid;grid-template-columns:140px minmax(0,1.4fr) minmax(60px,180px) 46px;gap:10px;align-items:center;font-size:14.5px}
@media (max-width:620px){ol.tl2 li{grid-template-columns:minmax(0,1fr) 80px 42px}ol.tl2 .when{grid-column:1/-1}}
.when{color:var(--mist);font-family:var(--f-data);font-size:13px}
.pbar{display:block;height:10px;background:var(--hull-2);border-radius:5px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--flare)}

/* Resultado */
.big{font-family:var(--f-display);font-size:clamp(60px,13vw,120px);line-height:1;color:var(--flare);font-variant-numeric:tabular-nums;filter:drop-shadow(0 6px 0 var(--hull-deep))}
.bigstars svg{width:clamp(44px,8vw,68px);height:clamp(44px,8vw,68px)}
.bigstars{display:flex;gap:8px}
.bigstars svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1) backwards}
.bigstars svg:nth-child(2){animation-delay:.18s}
.bigstars svg:nth-child(3){animation-delay:.36s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
ul.learn{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:68ch}
.code{font-family:var(--f-data);font-size:13px;word-break:break-all;background:var(--hull-deep);border:2px dashed var(--line);border-radius:5px;padding:10px 12px;user-select:all}

/* Equipas e classificação */
.emb{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--hull-deep);border:3px solid var(--foam)}
.emb.s{width:30px;height:30px;border-width:2px}
.emb svg{width:64%;height:64%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pick-grid{display:flex;gap:10px;flex-wrap:wrap}
.pick-it{background:none;border:3px solid transparent;border-radius:50%;padding:3px;cursor:pointer}
.pick-it[aria-pressed=true]{border-color:var(--flare)}
.swatch{display:block;width:38px;height:38px;border-radius:50%;border:2px solid var(--foam)}
.teamrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.ped{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.ped .nm{font-weight:800;line-height:1.15;overflow-wrap:anywhere;font-size:clamp(14px,2.2vw,19px)}
.ped .col{width:100%;border-radius:5px 5px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;font-family:var(--f-display);color:var(--hull-deep);animation:grow .7s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes grow{from{height:0}}
.ped .pts{font-family:var(--f-data);color:var(--flare);font-variant-numeric:tabular-nums}
.ped.p1 .col{height:170px;background:var(--flare);font-size:56px}
.ped.p2 .col{height:120px;background:#d5e3f7;font-size:42px}
.ped.p3 .col{height:88px;background:#e39a63;font-size:36px}
.src{font-family:var(--f-data);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mist)}
.ranktab td:nth-child(2){text-align:left;font-family:var(--f-body);font-weight:600}
.ranktab th:nth-child(2){text-align:left}
details>summary{cursor:pointer;font-weight:600}
.guide{display:flex;flex-direction:column;gap:12px}
.guide article{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:3px}
.empty{padding:22px;text-align:center;color:var(--mist);border:2px dashed var(--line);border-radius:5px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.fexam{background:#fff3c4;color:#3a2a00;border:2px solid #d99a00;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15.5px}
.fexb{display:inline-flex;align-items:center;background:#ffc23d;color:#1a1200;font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:4px 9px;white-space:nowrap}
.fexb.s{font-size:10.5px;padding:1px 6px}
.fkey{display:flex;flex-direction:column;gap:4px;align-items:flex-start;background:#fff3c4;color:#3a2a00;border:3px dashed #d99a00;border-radius:10px;padding:12px 16px}
.fkey span{font-weight:600;font-size:14.5px}
.fkey b{font-family:var(--f-data);font-size:clamp(32px,6vw,50px);letter-spacing:.12em;line-height:1.1}
</style>

<canvas id="sea" aria-hidden="true"></canvas>
<div id="app">
  <div id="hud" hidden></div>
  <main id="view"></main>
</div>

<script>
"use strict";
/* ---------- utilitários ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let audio=null;
function tone(f,d,w="triangle",v=.14,at=0){
  if(!S.sound)return;
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==="suspended")audio.resume();
    const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+at;
    o.type=w;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(audio.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

function L1(i,done){
  const deck=shuffle([...take(CARDS.filter(c=>c[1]),5),...take(CARDS.filter(c=>!c[1]),5)]);
  const SEC=10;let n=0,pts=0,marks=[];
  view.innerHTML=shell(i,"Uma tempestade apagou a memória do farol. Para começar, descobre que sistemas aprendem com dados e quais seguem apenas regras escritas por pessoas. Quanto mais depressa, mais pontos.",`
   <div class="plate"><div class="dots" id="dots"></div><div class="timer"><i id="tb"></i></div><div class="card" id="card" aria-live="polite"></div>
   <div class="choices" id="ch"><button class="btn good" data-a="1">Aprende com dados</button><button class="btn ghost" data-a="0">Só segue regras fixas</button></div><div id="fb"></div></div>`);
  let stop;
  const dots=()=>$("#dots").innerHTML=deck.map((_,k)=>`<i class="${marks[k]===1?"ok":marks[k]===0?"no":k===n?"cur":""}"></i>`).join("");
  function show(){
    clearRun();dots();$("#card").textContent=deck[n][0];$("#fb").innerHTML="";$$("#ch button").forEach(b=>b.disabled=false);
    stop=countdown(SEC,f=>{$("#tb").style.width=f*100+"%"},()=>answer(-1,0));
  }
  function answer(a){
    const f=stop();
    $$("#ch button").forEach(b=>b.disabled=true);
    const c=deck[n],ok=a===c[1];
    if(ok){pts+=70+30*f;sfx.ok()}else sfx.bad();
    marks[n]=ok?1:0;setPts(pts);dots();
    const label=c[1]?"Aprende com dados.":"Só segue regras fixas.";
    $("#fb").innerHTML=fbBox(ok,ok?"Certo!":a<0?"Acabou o tempo.":"Não desta vez.",`<br>${label} ${c[2]}`,n<9?"Próximo sistema":"Ver resultado");
    $("#next").focus();
    $("#next").onclick=()=>{n++;if(n<10)show();else done(pts,`${marks.filter(Boolean).length} de 10 certas`)};
  }
  $$("#ch button").forEach(b=>b.onclick=()=>answer(+b.dataset.a));
  show();
}

const FISH_BLOBS=[[.2,.76],[.2,.24],[.5,.86]], JELLY_BLOBS=[[.8,.22],[.82,.72],[.55,.3]];
function radarPoint(kind){
  const b=(kind?JELLY_BLOBS:FISH_BLOBS)[Math.floor(Math.random()*3)];
  return{x:clamp(b[0]+gauss()*.075,.03,.97),y:clamp(b[1]+gauss()*.075,.03,.97),k:kind};
}
const radarSet=n=>shuffle(Array.from({length:n},(_,i)=>radarPoint(i%2)));
function nearest(labeled,p){let best=null,bd=1e9;for(const q of labeled){const d=(q.x-p.x)**2+(q.y-p.y)**2;if(d<bd){bd=d;best=q}}return best?best.k:null}
const accuracy=(labeled,test)=>test.filter(p=>nearest(labeled,p)===p.k).length/test.length;
function drawFish(g,x,y,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,11,6.5,0,0,6.3);g.fill();g.beginPath();g.moveTo(x-9,y);g.lineTo(x-18,y-7);g.lineTo(x-18,y+7);g.closePath();g.fill();g.fillStyle="#0a1140";g.beginPath();g.arc(x+5,y-1,1.6,0,6.3);g.fill()}
function drawJelly(g,x,y,col){g.fillStyle=col;g.beginPath();g.arc(x,y-1,10,Math.PI,0);g.closePath();g.fill();g.strokeStyle=col;g.lineWidth=2;g.beginPath();for(let i=-6;i<=6;i+=4){g.moveTo(x+i,y-1);g.quadraticCurveTo(x+i+3,y+6,x+i,y+11)}g.stroke()}
function L2(i,done){
  const rounds=[4,10],res=[];let r=0;
  const FISH="#ffc23d",JELLY="#ff7f9b",SZ=[640,470],PAD=34;
  function start(){
    clearRun();
    const budget=rounds[r],pool=radarSet(40),test=radarSet(60);let labeled=[],phase="label",tested=[];
    view.innerHTML=shell(i,"O radar do farol vê criaturas no mar, mas não sabe distinguir <b>peixes</b> de <b>medusas</b>. Escolhe que pontos vais identificar. Cada etiqueta gasta orçamento, por isso escolhe exemplos variados. Dados simulados.",`
    <div class="split"><div class="plate"><canvas class="game" id="rad" width="${SZ[0]*2}" height="${SZ[1]*2}" aria-label="Gráfico de transparência e velocidade. Clica num ponto para o identificar."></canvas>
    <div class="legend"><span><i style="background:${FISH}"></i>Zona que o modelo acha peixe</span><span><i style="background:${JELLY}"></i>Zona que o modelo acha medusa</span></div></div>
    <div class="plate"><span class="eyebrow">Ronda ${r+1} de 2</span><h3 id="bud"></h3><p class="small muted">O modelo olha para o exemplo conhecido mais parecido e copia-lhe a etiqueta. As zonas coloridas mostram o que ele já pensa.</p>
    <button class="btn ghost" id="rnd">Identificar um ponto ao acaso</button><button class="btn" id="go" disabled>Testar o modelo</button><div id="out"></div></div></div>`);
    const cv=$("#rad"),g=cv.getContext("2d");g.scale(2,2);
    const px=p=>[PAD+p.x*(SZ[0]-PAD-10),SZ[1]-PAD-p.y*(SZ[1]-PAD-10)];
    function draw(){
      g.clearRect(0,0,SZ[0],SZ[1]);
      if(labeled.length){
        const step=12;
        for(let a=PAD;a<SZ[0]-10;a+=step)for(let b=10;b<SZ[1]-PAD;b+=step){
          const k=nearest(labeled,{x:(a+step/2-PAD)/(SZ[0]-PAD-10),y:(SZ[1]-PAD-b-step/2)/(SZ[1]-PAD-10)});
          g.fillStyle=k?"#ff7f9b30":"#ffc23d26";g.fillRect(a,b,step,step);
        }
      }
      g.strokeStyle="#ffffff30";g.lineWidth=1;g.beginPath();g.moveTo(PAD,10);g.lineTo(PAD,SZ[1]-PAD);g.lineTo(SZ[0]-10,SZ[1]-PAD);g.stroke();
      g.fillStyle="#a9bce6";g.font="13px Lexend, sans-serif";g.textAlign="center";g.fillText("Transparência →",SZ[0]/2,SZ[1]-11);
      g.save();g.translate(16,SZ[1]/2-12);g.rotate(-Math.PI/2);g.fillText("Velocidade →",0,0);g.restore();
      pool.forEach(p=>{if(p.seen)return;const [x,y]=px(p);g.fillStyle="#eef6ff";g.globalAlpha=.85;g.beginPath();g.arc(x,y,5.5,0,6.3);g.fill();g.globalAlpha=1});
      labeled.forEach(p=>{const [x,y]=px(p);p.k?drawJelly(g,x,y,JELLY):drawFish(g,x,y,FISH)});
      tested.forEach(p=>{const [x,y]=px(p);g.fillStyle=p.ok?"#2ee6b0":"#ff5a78";g.beginPath();g.arc(x,y,4,0,6.3);g.fill()});
    }
    function ui(){
      $("#bud").textContent=`Etiquetas: ${labeled.length} de ${budget}`;
      $("#go").disabled=!(phase==="label"&&labeled.length>=budget);
      $("#rnd").disabled=phase!=="label"||labeled.length>=budget;
    }
    function reveal(p){p.seen=true;labeled.push(p);sfx.tap();draw();ui()}
    cv.onclick=e=>{
      if(phase!=="label"||labeled.length>=budget)return;
      const b=cv.getBoundingClientRect(),mx=(e.clientX-b.left)*SZ[0]/b.width,my=(e.clientY-b.top)*SZ[1]/b.height;
      let hit=null,bd=26*26;pool.forEach(p=>{if(p.seen)return;const [x,y]=px(p),d=(x-mx)**2+(y-my)**2;if(d<bd){bd=d;hit=p}});
      if(hit)reveal(hit);
    };
    $("#rnd").onclick=()=>{const rest=pool.filter(p=>!p.seen);if(rest.length)reveal(rest[Math.floor(Math.random()*rest.length)])};
    $("#go").onclick=()=>{
      phase="test";ui();const acc=accuracy(labeled,test);let n=0;
      const id=setInterval(()=>{for(let q=0;q<4&&n<test.length;q++,n++){const p=test[n];tested.push({x:p.x,y:p.y,ok:nearest(labeled,p)===p.k})}draw();
        if(n>=test.length){clearInterval(id);res[r]=acc;sfx[acc>=.8?"ok":"bad"]();
          const f=[.35,.65],pts=res.reduce((a,v,k)=>a+f[k]*clamp((v-.5)/.42)*1000,0);setPts(pts);
          const pct=Math.round(acc*100);
          $("#out").innerHTML=fbBox(acc>=.8,`Acertou ${pct}%`,`em ${test.length} criaturas que o modelo nunca tinha visto.${r===0?" Com tão poucos exemplos é fácil falhar. Vais ter mais orçamento.":""}`,r===0?"Ronda seguinte":"Ver resultado");
          $("#next").focus();
          $("#next").onclick=()=>{if(r===0){r=1;start()}else done(pts,`Precisão ${Math.round(res[0]*100)}% com 4 etiquetas e ${Math.round(res[1]*100)}% com 10`)};
        }},45);
      timers.push(id);
    };
    draw();ui();
  }

}

const CAMS=[{n:"Dia",cost:1,max:30},{n:"Noite",cost:2,max:16},{n:"Nevoeiro",cost:3,max:12}];
const CENTER=[[.82,.72,.28],[.15,.28,.72],[.48,.62,.38]];
function camPoint(g,boat){const c=CENTER[g];return{x:c[0]+gauss()*.04,y:(boat?c[1]:c[2])+gauss()*.1,k:boat?1:0}}
function knn3(train,p){
  const d=train.map(q=>[((q.x-p.x)*3)**2+(q.y-p.y)**2,q.k]).sort((a,b)=>a[0]-b[0]).slice(0,3);
  if(!d.length)return Math.random()<.5?1:0;
  return d.reduce((a,b)=>a+b[1],0)*2>d.length?1:0;
}
function camEvaluate(counts){
  const train=[];counts.forEach((n,g)=>{for(let k=0;k<n;k++)train.push(camPoint(g,k%2))});
  return counts.map((_,g)=>{let ok=0;for(let k=0;k<80;k++){const p=camPoint(g,k%2);if(knn3(train,p)===p.k)ok++}return ok/80});
}
function camArt(g){
  const sky=["#7fd0ff","#141b52","#b9c2d2"][g],sea=["#2a7fd6","#0a1140","#8b97ac"][g];
  const boat=g===1?'<circle cx="104" cy="62" r="4" fill="#ffc23d"/><circle cx="92" cy="65" r="2" fill="#ff5a78"/>':`<path d="M84 60h40l-7 10H91z" fill="${g===2?"#6d7789":"#1b2a7a"}"/><path d="M103 34v25H88z" fill="${g===2?"#a2abbc":"#fff"}"/>`;
  const extra=g===0?'<circle cx="180" cy="20" r="11" fill="#ffc23d"/>':g===1?'<circle cx="30" cy="20" r="1.4" fill="#fff"/><circle cx="60" cy="12" r="1.2" fill="#fff"/><circle cx="170" cy="22" r="1.4" fill="#fff"/><circle cx="190" cy="10" r="1.1" fill="#fff"/>':'<rect width="220" height="90" fill="#dfe4ee" opacity=".42"/>';
  return `<svg viewBox="0 0 220 90" aria-hidden="true"><rect width="220" height="56" fill="${sky}"/><rect y="56" width="220" height="34" fill="${sea}"/>${boat}${extra}</svg>`;
}
function L3(i,done){
  let counts=[30,2,0],tests=0,best=0;
  const BUD=40,cost=()=>counts.reduce((a,n,g)=>a+n*CAMS[g].cost,0);
  view.innerHTML=shell(i,"O farol tem de encontrar barcos de dia, de noite e com nevoeiro. Imagens de noite e com nevoeiro são mais caras de recolher. O sucesso é medido pela <b>pior câmara</b>: um barco perdido no nevoeiro continua perdido. Dados simulados.",`
   <div class="plate"><div class="row between"><h3 id="cost"></h3><span class="small muted">Até 4 testes. Cada teste extra custa 100 pontos.</span></div>
   <div class="cams">${CAMS.map((c,g)=>`<div class="cam">${camArt(g)}<div class="row between"><b style="font-weight:600">${c.n}</b><span class="small muted">${c.cost} crédito${c.cost>1?"s":""} por imagem</span></div><label for="s${g}" class="small">Imagens: <span id="v${g}" style="font-family:var(--f-data)"></span></label><input type="range" id="s${g}" min="0" max="${c.max}" step="2" value="${counts[g]}"><div class="bar" aria-hidden="true"><i id="b${g}" style="width:0"></i></div><span class="small" id="r${g}">Sem teste</span></div>`).join("")}</div>
   <div class="row"><button class="btn" id="test">Treinar e testar</button><button class="btn ghost" id="end" disabled>Concluir missão</button></div><div id="out"></div></div>`);
  function ui(){
    counts.forEach((n,g)=>$("#v"+g).textContent=n);
    const over=cost()>BUD;
    $("#cost").textContent=`Orçamento: ${cost()} de ${BUD} créditos`;$("#cost").style.color=over?"var(--coral)":"";
    $("#test").disabled=over||tests>=4||counts.reduce((a,b)=>a+b)===0;
  }
  counts.forEach((_,g)=>$("#s"+g).oninput=e=>{counts[g]=+e.target.value;ui()});
  $("#test").onclick=()=>{
    const acc=camEvaluate(counts);tests++;
    acc.forEach((a,g)=>{const p=Math.round(a*100);const b=$("#b"+g);b.style.width=p+"%";b.className=a<.7?"crit":a<.85?"warn":"";$("#r"+g).textContent=`Encontrou ${p}% corretamente`});
    const worst=Math.min(...acc),avg=(acc[0]+acc[1]+acc[2])/3,w=acc.indexOf(worst);
    const pts=Math.max(0,clamp((worst-.5)/.32)*1000-100*(tests-1));best=Math.max(best,pts);setPts(best);
    sfx[worst>=.8?"ok":"bad"]();
    const msg=worst>=.8?`Bom equilíbrio. Todas as câmaras funcionam acima de 80%.`:`A média é ${Math.round(avg*100)}%, mas com ${CAMS[w].n.toLowerCase()} só acerta ${Math.round(worst*100)}%. O modelo quase não conhece esse caso.`;
    $("#out").innerHTML=fbBox(worst>=.8,`Teste ${tests} de 4.`,msg,"");
    $("#end").disabled=false;ui();if(tests>=4)$("#end").focus();
  };
  $("#end").onclick=()=>done(best,`${tests} teste${tests>1?"s":""} realizado${tests>1?"s":""}`);
  ui();
}

function playLevel(i){

  if(attemptFactor(t,i)<1){const box=$(".lvtop .grow");const n=document.createElement("p");n.className="small";n.style.color="var(--flare)";n.textContent=`Nova tentativa: este nível vale até ${Math.round(attemptFactor(t,i)*1000)} pontos.`;box.append(n)}
}
function finish(i,raw,detail){
  clearRun();
  const t=team(),f=attemptFactor(t,i),pts=Math.round(clamp(raw,0,1000)*f),prev=t.scores[i];
  t.att[i]=(t.att[i]||0)+1;fixTeam(t);t.log.push({l:i,p:pts,t:Date.now(),m:playersOf(t,i).join(""),...(exOf(t)?{x:exOf(t).id}:{})});if(t.log.length>200)t.log=t.log.slice(-200);
  const kept=prev==null||pts>prev?pts:prev;t.scores[i]=kept;save();
  go("result");
  const st=starsOf(pts),last=i===7;
  if(st>=2){sfx.win();Scene.burst()}else sfx.ok();
  const all=doneCount(t)===8;
  view.innerHTML=`<div class="wrap"><div class="plate" style="align-items:flex-start">
   <span class="eyebrow">Nível ${i+1} concluído · ${esc(LEVELS[i].t)}</span>

   <p class="muted">${esc(detail)}${f<1?` · tentativa com fator ${Math.round(f*100)}%`:""}${prev!=null&&pts<=prev&&!examOn()?` · mantém-se a melhor marca: ${prev} pontos`:""}</p>${examOn()?`<div class="fexam">Esta tentativa conta para a avaliação.${examLeft(t,i)>0?` Ainda podem jogar este nível mais ${examLeft(t,i)===1?"uma vez":examLeft(t,i)+" vezes"}.`:" Este nível já está fechado."}</div>`:""}
   ${members(t).length?`<p class="small">Jogaram: ${esc(idsNames(t,playersOf(t,i)))}</p>`:""}
   <h3>O que a equipa aprendeu</h3><ul class="learn">${LEVELS[i].learn.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
   <div class="row">${last||all?`<button class="btn" id="rank">Ver a classificação</button>`:(canPlay(t,i+1)?`<button class="btn" id="nx">Nível seguinte</button>`:"")}<button class="btn ghost" id="map">Voltar ao mapa</button>${examLeft(t,i)>0?'<button class="btn ghost" id="rep">Repetir nível</button>':""}<button class="btn ghost" id="sh">Enviar ao professor</button></div></div>
   ${all?`<div class="plate"><span class="eyebrow">Missão cumprida</span><h2>O farol voltou a brilhar</h2><p class="lead">A equipa ${esc(t.name)} termina com ${total(t)} pontos e o posto de ${rankName(total(t))}.</p></div>`:""}</div>`;
  let n=0;const steps=28,cnt=$("#cnt");
  if(reduced)cnt.textContent=pts;else{const id=setInterval(()=>{n++;cnt.textContent=Math.round(pts*n/steps);if(n>=steps)clearInterval(id)},30);timers.push(id)}
  const on=(id,fn)=>{const e=$("#"+id);if(e)e.onclick=fn};
  on("nx",()=>goBrief(i+1));on("map",goMap);on("rep",()=>goBrief(i));on("rank",goRank);on("sh",goShare);
}

  <div class="plate"><div class="row between"><div class="tabs">${tabs.map(([k,n])=>`<button class="tab" data-k="${k}" aria-pressed="${PV.tab===k}">${esc(n)}</button>`).join("")}</div><span class="row" style="gap:12px"><label class="small" style="display:flex;gap:8px;align-items:center"><b>Pontuação</b><select id="mt">${Object.entries(MET).map(([k,n])=>`<option value="${k}" ${PV.met===k?"selected":""}>${n}</option>`).join("")}</select></label><label class="small" style="display:flex;gap:8px;align-items:center"><b>Turma</b><select id="tu"><option value="">Todas</option>${turmas.map(x=>`<option ${x===PV.turma?"selected":""}>${esc(x)}</option>`).join("")}</select></label></span></div>${body}</div>
  <div class="plate"><h3>Chave de avaliação</h3><p class="small">Para uma aula de avaliação, crie a chave de hoje e escreva-a no quadro. Cada equipa escreve a chave no seu computador, no botão Avaliação, e passa a ter um número limitado de tentativas em cada nível. As equipas que não escreverem a chave continuam em treino. A chave só vale hoje e só neste jogo. Em avaliação, os treinos feitos antes não descontam pontos.</p><div class="row"><label class="small" style="display:flex;gap:8px;align-items:center"><b>Tentativas por nível</b><select id="exm">${[1,2,3].map(n=>`<option ${S.keyMax===n?"selected":""}>${n}</option>`).join("")}</select></label><button class="btn mini" id="mk">Criar a chave de hoje</button></div><div id="kbox"></div><p class="small muted">Para ver só as tentativas feitas com chave, escolha Pontuação: Avaliação.</p></div>
  <div class="plate"><h3>Equipas neste computador</h3>${S.teams.length?`<div class="row"><button class="btn mini" id="loc">Juntar as equipas deste computador</button></div>${turmasLocais().map(tu=>{const n=S.teams.filter(t=>(t.turma||"")===tu).length;return `<div class="row between" style="border-top:1px solid var(--line);padding-top:8px"><b style="font-weight:600">Turma ${esc(tu||"sem nome")} · ${n} equipa${n===1?"":"s"}</b><span><button class="btn ghost mini" data-delt="${esc(tu)}">Apagar as equipas desta turma</button></span></div>`}).join("")}${S.teams.slice().sort((a,b)=>(a.turma||"").localeCompare(b.turma||"","pt",{numeric:true})).map(t=>`<div class="teamrow">${emblem(t,true)}<div class="grow"><b style="font-weight:600">${esc(t.name)}</b><div class="small muted">${t.turma?esc(t.turma)+" · ":""}${total(t)} pontos${members(t).length?" · "+esc(members(t).map(m=>m.n).join(", ")):""}</div></div><span id="lt${t.id}"><button class="btn ghost mini" data-del="${t.id}">Apagar</button></span></div>`).join("")}`:'<p class="small muted">Não há equipas neste computador.</p>'}</div>
  <div class="plate"><h3>Definições da aula</h3>
   <div class="row between"><div class="grow"><b style="font-weight:600">Abrir todos os níveis</b><p class="small muted">Útil para trabalhar um nível específico numa aula.</p></div><button class="btn ghost mini" id="unl" aria-pressed="${S.unlock}">${S.unlock?"Abertos":"Por ordem"}</button></div>
   <div class="row between"><div class="grow"><b style="font-weight:600">Apagar os resultados recebidos</b><p class="small muted">Guarde antes uma cópia de segurança.</p></div><div class="row" id="wb"><button class="btn bad mini" style="box-shadow:0 3px 0 var(--coral-deep)" id="wipe" ${P.teams.length?"":"disabled"}>Apagar</button></div></div>
   <p class="small muted">Os resultados ficam guardados neste browser. Use a cópia de segurança para os passar para outro computador ou para não os perder ao limpar o browser.</p></div>
  <div class="plate"><h3>Guia dos níveis</h3><p class="small muted">Os tempos são estimativas, incluindo debate. Cada nível vale até 1000 pontos. Repetir um nível reduz o máximo em 15% por tentativa, até 50%.</p>
   <div class="guide">${LEVELS.map((L,i)=>`<article><span class="eyebrow">Nível ${i+1} · cerca de ${L.min} min</span><b style="font-weight:800">${esc(L.t)}: ${esc(L.c)}</b><span class="small"><span class="muted">Pergunta para debate:</span> ${esc(L.q)}</span></article>`).join("")}</div>
   <p class="small muted">Os dados dos níveis 2, 3 e 5 são simulados, mas os modelos funcionam mesmo: vizinho mais próximo nos níveis 2 e 3, e Q-learning no nível 5. Os resultados são calculados em cada jogada.</p></div></div>`;
  const msg=t=>$("#msg").textContent=t;
  const take2=txt=>{const cs=txt.match(/FAROL2?\.[A-Za-z0-9_~]+\.[A-Z0-9]{5}/g)||[];let n=0,u=0,bad=0;cs.forEach(c=>{const t=readCode(c);if(!t){bad++;return}mergeTeam(P.teams,t)==="nova"?n++:u++});bad+=Math.max(0,(txt.match(/FAROL2?\.\S*/g)||[]).length-cs.length);save();return{n,u,bad,tot:cs.length}};
  const report=r=>{if(!r.tot&&!r.bad){msg("Não foi encontrado nenhum código.");return}profMain();msg([r.n?`${r.n} equipa${r.n>1?"s":""} nova${r.n>1?"s":""}.`:"",r.u?`${r.u} equipa${r.u>1?"s":""} atualizada${r.u>1?"s":""}.`:"",r.bad?`${r.bad} código${r.bad>1?"s":""} com erro: peçam à equipa para o copiar outra vez.`:""].filter(Boolean).join(" "))};
  $("#add").onclick=()=>report(take2($("#codes").value));
  $("#ff").onchange=async e=>{let txt="";for(const f of e.target.files)txt+="\n"+await f.text();report(take2(txt))};
  $("#rf").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=="operacao-farol-prof"||!Array.isArray(d.teams))throw 0;let n=0;d.teams.forEach(t=>{if(t&&t.id&&Array.isArray(t.scores)){mergeTeam(P.teams,t);n++}});save();profMain();msg(`Cópia aberta: ${n} equipa${n===1?"":"s"}.`)}catch(x){msg("Este ficheiro não é uma cópia de segurança da Operação Farol.")}};
  const stamp=()=>new Date().toISOString().slice(0,10);
  $("#bk").onclick=async()=>{const ok=await saveFile(`OperacaoFarol_copia_${stamp()}.json`,JSON.stringify({app:"operacao-farol-prof",v:1,saved:Date.now(),teams:P.teams}),"application/json");msg(ok?"Cópia de segurança guardada.":"A cópia não foi guardada.")};
  $("#xl").onclick=async()=>{const l=shownTeams(),ok=await saveFile(`OperacaoFarol_resultados${PV.turma?"_"+PV.turma.replace(/[^A-Za-z0-9]+/g,""):""}_${stamp()}.xlsx`,buildXlsx(l));msg(ok?`Ficheiro Excel criado com ${l.length} equipa${l.length===1?"":"s"}.`:"O ficheiro não foi guardado.")};
  $$(".tab").forEach(b=>b.onclick=()=>{PV.tab=b.dataset.k;PV.sel=null;profMain()});
  $("#tu").onchange=e=>{PV.turma=e.target.value;PV.sel=null;profMain()};
  $("#mt").onchange=e=>{PV.met=e.target.value;profMain()};
  const showKey=()=>{$("#kbox").innerHTML=`<div class="fkey"><span>Chave de hoje, ${fmtD(Date.now())}, com ${S.keyMax===1?"1 tentativa":S.keyMax+" tentativas"} por nível</span><b id="kv">${makeKey(S.keyMax)}</b></div>`};
  $("#exm").onchange=e=>{S.keyMax=+e.target.value;save();if($("#kv"))showKey()};
  $("#mk").onclick=()=>{showKey();sfx.tap()};
  $$("tr.pick").forEach(r=>{const f=()=>{PV.sel=PV.sel===r.dataset.id?null:r.dataset.id;profMain();const p=$(".path");if(p)p.scrollIntoView({block:"nearest"})};r.onclick=f;r.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
  if($("#rm"))$("#rm").onclick=()=>{$("#rmb").innerHTML='<span class="small">Remover dos resultados recebidos?</span> <button class="btn bad mini" id="y">Sim, remover</button> <button class="btn ghost mini" id="n">Não</button>';$("#y").onclick=()=>{P.teams=P.teams.filter(t=>t.id!==PV.sel);PV.sel=null;save();profMain()};$("#n").onclick=profMain};
  if($("#loc"))$("#loc").onclick=()=>{let n=0,u=0;S.teams.forEach(t=>mergeTeam(P.teams,t)==="nova"?n++:u++);save();profMain();msg(`${n} nova${n===1?"":"s"}, ${u} atualizada${u===1?"":"s"}.`)};
  $$("[data-delt]").forEach(b=>b.onclick=()=>{const tu=b.dataset.delt,box=b.parentElement;box.innerHTML='<span class="small">Junte primeiro os resultados. Apagar mesmo?</span> <button class="btn bad mini" data-yt>Sim, apagar</button>';$("[data-yt]",box).onclick=()=>{S.teams=S.teams.filter(t=>(t.turma||"")!==tu);if(!team())S.current=null;if(S.curTurma===tu)S.curTurma=null;save();profMain()}});
  $$("[data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del;$("#lt"+id).innerHTML=`<button class="btn bad mini" data-y="${id}">Apagar mesmo</button>`;$(`[data-y="${id}"]`).onclick=()=>{S.teams=S.teams.filter(t=>t.id!==id);if(S.current===id)S.current=null;save();profMain()}});
  $("#unl").onclick=()=>{S.unlock=!S.unlock;save();$("#unl").textContent=S.unlock?"Abertos":"Por ordem";$("#unl").setAttribute("aria-pressed",S.unlock)};
  $("#wipe").onclick=()=>{$("#wb").innerHTML='<span class="small">Tem a certeza?</span><button class="btn bad mini" id="y">Sim, apagar</button><button class="btn ghost mini" id="n">Não</button>';$("#y").onclick=()=>{P.teams=[];PV.sel=null;save();profMain()};$("#n").onclick=profMain};
  $("#out").onclick=()=>{profOk=false;team()?goMap():goStart()};
}

/* --- ficheiro Excel (.xlsx) criado no próprio browser --- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function zipStore(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 for(const f of files){const nm=enc.encode(f.name),d=enc.encode(f.data),crc=crc32(d),h=new DataView(new ArrayBuffer(30));
  [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,0,2],[12,0x21,2],[14,crc,4],[18,d.length,4],[22,d.length,4],[26,nm.length,2],[28,0,2]].forEach(([o,v,s])=>s===4?h.setUint32(o,v,true):h.setUint16(o,v,true));
  parts.push(new Uint8Array(h.buffer),nm,d);const c=new DataView(new ArrayBuffer(46));
  [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,0,2],[14,0x21,2],[16,crc,4],[20,d.length,4],[24,d.length,4],[28,nm.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,off,4]].forEach(([o,v,s])=>s===4?c.setUint32(o,v,true):c.setUint16(o,v,true));
  cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length}
 const size=cd.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,size,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}
const xe=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const colL=n=>{let s="";n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
function sheetXml(rows,widths){const r=rows.map((row,y)=>`<row r="${y+1}">${row.map((v,x)=>{const ref=colL(x)+(y+1),st=y===0?' s="1"':"";if(v===null||v===undefined||v==="")return `<c r="${ref}"${st}/>`;if(typeof v==="number")return `<c r="${ref}"${st}><v>${v}</v></c>`;return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xe(v)}</t></is></c>`}).join("")}</row>`).join("");
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${r}</sheetData></worksheet>`}
function buildXlsx(list){const sheets=[];
 const L=(t,i)=>{const v=lastT(t,i);return v?fmtD(v)+" "+fmtH(v):""};
 const MK=["best","first","mean","exam"];
 sheets.push(["Resumo",[["Equipa","Turma","Elementos",...LEVELS.map((x,i)=>`N${i+1} ${x.t} (melhor)`),...MK.map(k=>"Total: "+MET[k].toLowerCase()),"Posto","Níveis concluídos","Tentativas","Tentativas em avaliação","Última atividade"],...list.map(t=>[t.name,t.turma||"",members(t).map(m=>memLabel(t,m)).join(", "),...t.scores.map(v=>v??""),...MK.map(k=>mTotal(t,k)),rankName(total(t)),doneCount(t),t.log.length,t.log.filter(l=>l.x).length,L(t)])],[22,10,36,...LEVELS.map(()=>14),16,16,16,16,16,10,11,12,18]]);
 const er=[["Equipa","Turma da equipa","Elemento","Turma do elemento",...LEVELS.map((x,i)=>`N${i+1} ${x.t} (tentativas)`),"Total de tentativas"]];
 list.forEach(t=>(t.members||[]).filter(m=>!m.out||t.log.some(l=>(l.m||"").includes(m.id))).forEach(m=>{const c=LEVELS.map((_,i)=>t.log.filter(l=>l.l===i&&(l.m||"").includes(m.id)).length);er.push([t.name,t.turma||"",m.n+(m.out?" (saiu da equipa)":""),m.t||t.turma||"",...c,c.reduce((a,b)=>a+b,0)])}));
 sheets.push(["Elementos",er,[22,12,22,14,...LEVELS.map(()=>16),12]]);
 LEVELS.forEach((x,i)=>sheets.push([`N${i+1} ${x.t}`.slice(0,31),[["Equipa","Turma","Elementos que jogaram","Melhor pontuação","Estrelas","1.ª tentativa","Média das tentativas","Avaliação","Tentativas","Tentativas em avaliação","Última vez"],...list.map(t=>[t.name,t.turma||"",idsNames(t,playedIn(t,i)),t.scores[i]??"",t.scores[i]!=null?starsOf(t.scores[i]):"",metric(t,i,"first")??"",metric(t,i,"mean")??"",metric(t,i,"exam")??"",t.att[i]||0,tries(t,i).filter(l=>l.x).length,L(t,i)])],[22,10,36,14,9,13,14,11,11,13,18]]));
 const pr=[["Equipa","Turma","Nível","Tema","Elementos","Pontos","Modo","N.º da tentativa","Data","Hora"]];list.forEach(t=>{const nn={};t.log.forEach(l=>{nn[l.l]=(nn[l.l]||0)+1;pr.push([t.name,t.turma||"",l.l+1,LEVELS[l.l].t,l.m?idsNames(t,l.m):"",l.p,l.x?"Avaliação":"Treino",nn[l.l],fmtD(l.t),fmtH(l.t)])})});
 sheets.push(["Percurso",pr,[22,10,7,22,36,9,11,10,12,8]]);
 const files=[{name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`},
 {name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
 {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xe(s[0].replace(/[\[\]:*?\/\\]/g," "))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`},
 {name:"xl/_rels/workbook.xml.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
 {name:"xl/styles.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF121C5C"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},
 ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:sheetXml(s[1],s[2])}))];
 return zipStore(files)}
