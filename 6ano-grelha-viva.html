<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Grelha Viva</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Estrutura comum. Cada jogo define os tokens de cor e de letra na sua pele (skin.css). */
html,body{height:100%}
body{background:var(--bg);color:var(--bg-ink);font-family:var(--f-b);font-weight:500;font-size:18px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:30}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--top);color:var(--top-ink);flex:none;z-index:5;min-height:58px}
#top .sp{flex:1}
.brand{font-family:var(--f-d);font-size:21px;background:none;border:0;color:var(--top-acc);cursor:pointer;padding:0;white-space:nowrap}
@media (max-width:560px){.brand{display:none}}
.ghost{font-weight:700;font-size:15px;background:transparent;color:inherit;border:2px solid currentColor;border-radius:var(--r-btn);padding:5px 12px;cursor:pointer;white-space:nowrap;opacity:.92}
.ghost:hover{opacity:1}
.score{display:flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums;font-size:17px}
.score svg{width:22px;height:22px}
.tmb{display:flex;align-items:center;gap:6px;background:none;border:2px solid currentColor;border-radius:30px;color:inherit;font-weight:700;font-size:15px;padding:2px 10px 2px 2px;cursor:pointer;min-width:0;max-width:200px;opacity:.95}
.tmb span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.tmb span:last-child{display:none}.tmb{padding:2px}}
#view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1060px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.narrow2{max-width:720px}.wide{max-width:1180px}
h1,h2,h3{margin:0;font-family:var(--f-d);font-weight:var(--w-d,700);line-height:1.08;text-wrap:balance}
p{margin:0}
.stage{background:var(--paper);color:var(--paper-ink);border:var(--bd) solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:clamp(14px,2.6vw,24px);display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font-weight:800;font-size:17px;border:var(--bd) solid var(--btn-line);background:var(--acc);color:var(--acc-ink);border-radius:var(--r-btn);padding:10px 20px;cursor:pointer;box-shadow:var(--sh-btn);transition:transform .1s;text-decoration:none;display:inline-flex;align-items:center;gap:7px;line-height:1.2}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.white{background:var(--paper);color:var(--paper-ink)}
.btn.small{font-size:15px;padding:6px 13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.q{font-family:var(--f-d);font-size:clamp(20px,2.8vw,26px);line-height:1.2;font-weight:var(--w-d,700)}
.muted{color:var(--muted)}
.small2{font-size:15px}
.help{background:var(--help);color:var(--paper-ink);border:2px dashed var(--line);border-radius:calc(var(--r) - 4px);padding:10px 14px;font-size:16px}
/* Início */
.hero{display:flex;gap:clamp(12px,3vw,28px);align-items:center;flex-wrap:wrap}
.hero .masc{width:clamp(110px,18vw,170px);flex:none}
.hero .ht{flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.zone{--c:var(--acc);text-align:left;color:var(--paper-ink);background:var(--paper);border:var(--bd) solid var(--line);border-radius:var(--r);box-shadow:var(--sh);cursor:pointer;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .14s}
.zone:hover:not(:disabled){transform:translateY(-4px) rotate(-.4deg)}
.zone:disabled{cursor:not-allowed;filter:grayscale(.85);opacity:.7}
.zone .art{background:var(--c);display:flex;gap:8px;justify-content:center;align-items:center;padding:16px 10px;min-height:112px;position:relative}
.zone .art svg{width:66px;height:66px}
.zone .zt{padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px}
.zone h2{font-size:25px}
.zone p{font-size:16px;color:var(--muted)}
.zone .no{font-family:var(--f-m);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.pips{display:flex;gap:5px;align-items:center;font-size:14px;font-weight:700;margin-top:2px}
.pips i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--paper2)}
.pips i.on{background:var(--c)}
.pips span{margin-left:6px}
.foot{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;color:var(--bg-ink);font-size:15px}
/* Temática */
.head{display:flex;flex-direction:column;gap:4px;color:var(--bg-ink)}
.head h2{font-size:clamp(32px,5vw,48px)}
.head p{font-size:18px;max-width:60ch}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.act{--c:var(--acc);display:flex;gap:14px;align-items:center;text-align:left;color:var(--paper-ink);background:var(--paper);border:var(--bd) solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;cursor:pointer;transition:transform .14s;min-width:0}
.act:hover:not(:disabled){transform:translateY(-3px)}
.act:disabled{cursor:not-allowed;opacity:.62}
.act .ic{width:64px;height:64px;border-radius:calc(var(--r) - 6px);background:var(--c-soft,var(--paper2));display:grid;place-items:center;flex:none;position:relative}
.act .ic svg{width:44px;height:44px}
.act .lv{position:absolute;left:-6px;top:-8px;background:var(--c);color:var(--c-ink,#fff);font-family:var(--f-m);font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px}
.act b{display:block;font-family:var(--f-d);font-size:21px;line-height:1.1;font-weight:var(--w-d,700)}
.act span{display:block}
.act .ds{font-size:15.5px;color:var(--muted)}
.act .pts{font-size:14.5px;font-weight:800;color:var(--c);margin-top:3px}
.who{background:var(--paper);color:var(--paper-ink);border:var(--bd) solid var(--line);border-radius:var(--r);padding:11px 14px;display:flex;flex-direction:column;gap:8px}
.who b{font-family:var(--f-d);font-size:20px;font-weight:var(--w-d,700)}
.who .btn{align-self:flex-start}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-weight:800;font-size:16px;border:2px solid var(--line);border-radius:30px;padding:5px 13px;background:var(--paper);color:var(--paper-ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--c,var(--acc));color:var(--c-ink,var(--acc-ink));border-color:var(--c,var(--acc))}
.chip[aria-pressed=true]::before{content:"✓ "}
.tk{background:var(--paper);color:var(--paper-ink);border:var(--bd) solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tk h3{font-size:22px;color:var(--c,var(--acc2))}
/* Moldura das atividades */
.ahead{display:flex;flex-direction:column;gap:2px;color:var(--bg-ink)}
.ahead .tag{font-family:var(--f-m);font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.ahead h2{font-size:clamp(28px,4.4vw,40px)}
.talk{display:flex;gap:12px;align-items:flex-start}
.talk .masc{width:clamp(70px,11vw,100px);flex:none}
.bubble{flex:1;min-width:0;background:var(--paper);color:var(--paper-ink);border:var(--bd) solid var(--line);border-radius:var(--r);padding:12px 16px;position:relative;display:flex;flex-direction:column;gap:8px;font-size:18px}
.bubble.right{background:var(--ok-soft);border-color:var(--ok)}
.bubble.wrong{background:var(--no-soft);border-color:var(--no)}
.bubrow{display:flex;gap:8px;flex-wrap:wrap}
.count{display:flex;gap:6px;flex-wrap:wrap}
.count i{width:14px;height:14px;border-radius:50%;background:var(--paper2);border:2px solid var(--line)}
.count i.cur{background:var(--acc)}.count i.ok{background:var(--ok);border-color:var(--ok)}.count i.no{background:var(--no);border-color:var(--no)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{font-weight:700;font-size:17px;text-align:left;background:var(--opt);color:var(--paper-ink);border:var(--bd) solid var(--line);border-radius:calc(var(--r) - 4px);padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0;overflow-wrap:anywhere;transition:transform .1s}
.opt:hover:not(:disabled){transform:translateY(-2px);background:var(--opt-h)}
.opt:disabled{cursor:default}
.opt svg{width:36px;height:36px;flex:none}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--no-soft);border-color:var(--no)}
.opt.sel{background:var(--sel);border-color:var(--acc2)}
.opt.done{visibility:hidden}
.opt.mono,.mono{font-family:var(--f-m)}
.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .4s cubic-bezier(.3,1.7,.5,1) backwards}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.fld{font:inherit;font-weight:600;font-size:18px;color:var(--paper-ink);background:var(--field);border:2px solid var(--line);border-radius:calc(var(--r) - 6px);padding:9px 12px;width:100%;min-width:0}
textarea.fld{font-family:var(--f-m);font-size:13.5px;resize:vertical}
.fl{font-weight:800;font-size:17px}
.pairs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 14px}
.pairs .col{display:flex;flex-direction:column;gap:8px}
.slots{display:flex;flex-direction:column;gap:8px;counter-reset:sl}
.slotb{border:2px dashed var(--line);border-radius:calc(var(--r) - 4px);padding:10px 12px;min-height:50px;display:flex;align-items:center;gap:10px;font-weight:700;background:var(--paper2)}
.slotb::before{counter-increment:sl;content:counter(sl);font-family:var(--f-m);width:28px;height:28px;border-radius:50%;background:var(--line);color:var(--paper);display:grid;place-items:center;flex:none;font-size:14px}
.slotb.full{border-style:solid;background:var(--ok-soft);border-color:var(--ok)}
/* Fim */
.end{align-items:center;text-align:center}
.end .masc{width:150px}
.end h2{font-size:clamp(36px,6vw,54px);color:var(--acc2)}
.big{font-family:var(--f-d);font-size:68px;line-height:1;font-variant-numeric:tabular-nums}
.bstars{display:flex;gap:6px}
.bstars svg{width:56px;height:56px;animation:pop .4s cubic-bezier(.3,1.7,.5,1) backwards}
.bstars svg:nth-child(2){animation-delay:.15s}.bstars svg:nth-child(3){animation-delay:.3s}
/* Equipas e professor */
.tb{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;border:3px solid var(--line);flex:none}
.tb svg{width:66%;height:66%}.tb.s{width:30px;height:30px;border-width:2px}
.trow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px dashed var(--paper2);padding-bottom:10px}
.trow .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.trow b{font-family:var(--f-d);font-size:22px;line-height:1.1;overflow-wrap:anywhere;font-weight:var(--w-d,700)}
.trow span{font-size:15.5px}
.ttl2{font-size:clamp(28px,4.5vw,38px);color:var(--acc2)}.ttl3{font-size:24px;color:var(--acc2)}
.picks{display:flex;gap:8px;flex-wrap:wrap}
.pk{background:none;border:4px solid transparent;border-radius:50%;padding:2px;cursor:pointer}.pk[aria-pressed=true]{border-color:var(--acc2)}
.sw{display:block;width:46px;height:46px;border-radius:50%;border:3px solid var(--line)}
.codebox{font-family:var(--f-m);font-size:13px;word-break:break-all;background:var(--paper2);border:2px dashed var(--line);border-radius:calc(var(--r) - 6px);padding:10px 12px;user-select:all;max-height:160px;overflow:auto}
.prog{display:grid;gap:8px}.prog>div{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) 60px;gap:10px;align-items:center;font-size:16px}
.prog b{color:var(--c);font-weight:800}
.pbar{display:block;height:14px;background:var(--paper2);border:2px solid var(--line);border-radius:8px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--c,var(--acc))}
.pgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-weight:800;font-size:15.5px;border:2px solid var(--line);border-radius:30px;background:var(--paper);color:var(--paper-ink);padding:5px 13px;cursor:pointer}.tab[aria-pressed=true]{background:var(--line);color:var(--paper)}
.tw{overflow-x:auto;border:2px solid var(--line);border-radius:calc(var(--r) - 4px)}
table.pt{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
table.pt th{background:var(--th);color:var(--th-ink);text-align:left;padding:7px 9px;font-weight:800;white-space:nowrap}
table.pt td{padding:7px 9px;border-top:1px solid var(--paper2);white-space:nowrap}
table.pt td.n{text-align:center}table.pt small{color:var(--muted);font-size:12.5px}
table.pt tr.pick{cursor:pointer}table.pt tr.pick:hover td{background:var(--opt-h)}table.pt tr.sel td,table.pt tr.me td{background:var(--sel)}
table.pt td.wr{white-space:normal;min-width:150px;font-size:14px}
table.pt.rank td{font-size:16px}table.pt.rank td.pos{width:44px;text-align:center}
.med{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);font-weight:800;font-size:15px;background:var(--paper)}
.med.m1{background:#ffd23f;color:#1b1b1b}.med.m2{background:#dfe6f2;color:#1b1b1b}.med.m3{background:#f2b27a;color:#1b1b1b}
.tn{display:inline-flex;align-items:center;gap:7px;font-weight:800}
.path{border:2px solid var(--line);border-radius:calc(var(--r) - 4px);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--paper2)}
ol.tl2{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ol.tl2 li{display:grid;grid-template-columns:140px minmax(0,1fr) minmax(0,1.3fr) minmax(60px,150px) 36px;gap:10px;align-items:center;font-size:15.5px}
@media (max-width:620px){ol.tl2 li{grid-template-columns:minmax(0,1fr) 70px 32px}ol.tl2 .when{grid-column:1/-1;font-size:13.5px}ol.tl2 .whom{grid-column:1/-1;order:5}}
.when{color:var(--muted);font-variant-numeric:tabular-nums}
.whom{font-size:14px;color:var(--muted)}
.mlist{flex-basis:100%;font-size:15px!important;color:var(--muted)}
.mlist2{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:30px minmax(0,2fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.mi{width:30px;height:30px;border-radius:50%;background:var(--line);color:var(--paper);display:grid;place-items:center;font-weight:800}
@media (max-width:520px){.mrow{grid-template-columns:30px minmax(0,1fr) 84px}.mrow .btn{grid-column:2/-1;justify-self:start}}
.mem3{display:flex;flex-wrap:wrap;gap:6px}.mem3 span{background:var(--paper);border-radius:10px;padding:4px 9px;font-size:14.5px}.mem3 span.off{opacity:.55}
/* Estúdio de avatares */
.avs{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.avs{grid-template-columns:minmax(0,1fr)}}
.avp{display:flex;flex-direction:column;gap:12px;align-items:center;position:sticky;top:0}
.avp svg{width:100%;max-width:300px;height:auto;border-radius:50%;border:var(--bd) solid var(--line);box-shadow:var(--sh);background:var(--paper2)}
.avopt{display:flex;flex-direction:column;gap:12px;min-width:0}
.avg{display:flex;flex-direction:column;gap:6px}
.avg>b{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.avr{display:flex;flex-wrap:wrap;gap:7px}
.avb{border:3px solid transparent;border-radius:12px;padding:2px;background:var(--paper2);cursor:pointer;width:58px;height:58px;display:grid;place-items:center}
.avb svg{width:100%;height:100%}
.avb[aria-pressed=true]{border-color:var(--acc2)}
.avc{width:38px;height:38px;border-radius:50%;border:3px solid var(--paper);outline:2px solid var(--line);cursor:pointer;padding:0}
.avc[aria-pressed=true]{outline:4px solid var(--acc2)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* modo avaliação */
.exam{background:#fff3c4;color:#3a2a00;border:3px solid #d99a00;border-radius:calc(var(--r) - 2px);padding:10px 14px;font-weight:800;font-size:16.5px}
.exb{display:inline-block;background:#d99a00;color:#1a1200;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 9px;white-space:nowrap}
.exb.s{font-size:11px;padding:1px 6px;vertical-align:middle}
.keyb{display:flex;flex-direction:column;gap:4px;align-items:flex-start;background:#fff3c4;color:#3a2a00;border:3px dashed #d99a00;border-radius:12px;padding:12px 16px}
.keyb span{font-weight:700;font-size:15px}
.keyb b{font-family:var(--f-m);font-size:clamp(34px,6vw,52px);letter-spacing:.12em;line-height:1.1}

/* Grelha Viva: tudo é uma grelha. Fundo de papel quadriculado verde-água, cartões brancos com cantos de célula, marcador amarelo, verde de folha de cálculo e vermelho de LED. Um só visual claro, de propósito. */
:root{color-scheme:light;
 --grid:#d6ebe0;--paperq:#f3faf6;--ink6:#16324a;--sheet:#1f9d55;--led:#ff3b30;--marker:#ffe066;
 --bg:#f3faf6;--bg-ink:#16324a;--top:#16324a;--top-ink:#ffffff;--top-acc:#ffe066;
 --paper:#ffffff;--paper-ink:#16324a;--paper2:#eaf5ee;--muted:#4f6a7d;--line:#16324a;--field:#ffffff;
 --acc:#1f9d55;--acc-ink:#ffffff;--acc2:#1f7a45;--btn-line:#16324a;--focus:#ff3b30;
 --ok:#1f9d55;--ok-soft:#d8f5e3;--no:#e5383b;--no-soft:#ffe1e1;--opt:#ffffff;--opt-h:#f0f9f3;--sel:#fff3b0;--help:#fffbe0;
 --th:#16324a;--th-ink:#fff;--star:#ffcc00;--star-off:#dbe7e0;
 --r:10px;--r-btn:10px;--bd:3px;--sh:5px 5px 0 #16324a;--sh-btn:3px 3px 0 #16324a;
 --f-d:"Lilita One","Trebuchet MS",Verdana,sans-serif;--f-b:"Nunito","Trebuchet MS",Verdana,sans-serif;--f-m:"JetBrains Mono",Consolas,monospace;--w-d:400}
.logo{font-family:var(--f-d);font-size:clamp(56px,11vw,112px);line-height:.9;color:var(--ink6);letter-spacing:.01em}
.logo em{font-style:normal;color:#fff;background:var(--sheet);padding:0 .16em;border:3px solid var(--ink6);box-shadow:5px 5px 0 var(--ink6);display:inline-block;transform:rotate(-2deg)}
.logo small{display:block;font-family:var(--f-m);font-size:15px;font-weight:700;letter-spacing:.12em;color:var(--ink6);margin-top:16px}
.logo small b{background:var(--marker);padding:0 6px}
.lead{font-size:20px;font-weight:700;max-width:46ch}
.t-sheet{--c:#1f9d55;--c-soft:#d8f5e3;--c-ink:#fff}
.t-bit{--c:#e5383b;--c-soft:#ffe1e1;--c-ink:#fff}
.zone .art{border-bottom:3px solid var(--line);background-color:var(--c-soft);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px}

<script>
/* ===== Motor comum: equipas, códigos, professor, Excel, classificação e avatares ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const take=(a,n)=>shuffle(a).slice(0,n);
const pick1=a=>a[Math.floor(Math.random()*a.length)];
const view=$("#view"),topbar=$("#top");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
let timers=[],leaveFn=null,scr=0;
const later=(f,ms)=>{const id=setTimeout(f,ms);timers.push(id);return id};
const every=(f,ms)=>{const id=setInterval(f,ms);timers.push(id);return id};
const clearAll=()=>{scr++;if(leaveFn){leaveFn();leaveFn=null}timers.forEach(clearTimeout);timers.forEach(clearInterval);timers=[]};
const escH=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tidy=s=>String(s).replace(/[|\r\n\t]/g," ").replace(/\s+/g," ").trim();
const fmtD=t=>new Date(t).toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit",year:"numeric"});
const fmtH=t=>new Date(t).toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});

let G=null,THEMES=[],allActs=[],S=null,KEY="";
const mem={};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const team=()=>S.teams.find(t=>t.id===S.current)||null;
const save=()=>store.set(KEY,JSON.stringify(S));
const best=()=>{const t=team();return t?t.best:{}};
const totalPts=()=>Object.values(best()).reduce((a,b)=>a+b,0);
const themeOf=id=>THEMES.find(t=>t.acts.some(a=>a.id===id));
const actOf=id=>allActs.find(a=>a.id===id);
const themeDone=id=>{const t=THEMES.find(x=>x.id===id);return t&&t.acts.every(a=>best()[a.id]!=null)};
const isOpen=a=>{if(!G.locked)return true;const i=allActs.indexOf(a);return i<=0||best()[allActs[i-1].id]!=null};
const starsFor=p=>p>=90?3:p>=60?2:1;
/* avaliação: métricas a partir do registo de tentativas */
const tries=(t,id)=>(t.log||[]).filter(l=>l.a===id);
const MET={best:"Melhor pontuação",first:"1.ª tentativa",mean:"Média das tentativas",exam:"Avaliação"};
function metric(t,id,k){if(k==="best")return t.best[id]??null;const L=tries(t,id);if(k==="exam"){const X=L.filter(l=>l.x);return X.length?Math.max(...X.map(l=>l.p)):null}if(!L.length)return null;if(k==="first")return L[0].p;return Math.round(L.reduce((a,l)=>a+l.p,0)/L.length)}
/* chave de avaliação: o professor cria-a, vale só no dia em que foi criada e só neste jogo; cada equipa escreve-a */
const KA="23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
const dayN=()=>{const d=new Date();return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,0,1))/864e5)};
const kEnc=n=>[Math.floor(n/1024)%32,Math.floor(n/32)%32,n%32].map(i=>KA[i]).join("");
const kChk=b=>{const h=hash("exam:"+b);return KA[parseInt(h.slice(0,2),36)%32]+KA[parseInt(h.slice(2,4),36)%32]};
function makeKey(max){const b=kEnc(dayN()*3+(max-1));return "AV-"+b+kChk(b)}
function readKey(k){const v=String(k).toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/^AV/,"").replace(/0/g,"O");if(v.length!==5||[...v].some(c=>!KA.includes(c)))return null;const b=v.slice(0,3);if(kChk(b)!==v.slice(3))return null;const n=b.split("").reduce((a,c)=>a*32+KA.indexOf(c),0);return{id:n,day:Math.floor(n/3),max:n%3+1}}
const EX=t=>{t=t||(typeof team==="function"?team():null);return t&&t.ex&&t.ex.day===dayN()?t.ex:null};
const examOn=t=>!!EX(t);
const examMax=t=>EX(t)?EX(t).max:1;
const examUsed=(t,id)=>{const e=EX(t);return e?tries(t,id).filter(l=>l.x===e.id).length:0};
const examLeft=(t,id)=>EX(t)?Math.max(0,EX(t).max-examUsed(t,id)):Infinity;
const examTxt=()=>`Modo avaliação: cada jogo só pode ser jogado ${examMax()===1?"uma vez":examMax()+" vezes"}. ${examMax()===1?"Essa tentativa conta para a avaliação.":"Conta a melhor dessas tentativas."} Pensem bem antes de responder!`;

/* som */
let ac=null;
function tone(f,d,at=0,type="triangle",v=.12){if(!S||!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+at;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={ok(){tone(660,.13);tone(880,.2,.1)},no(){tone(260,.16,0,"sine");tone(200,.24,.13,"sine")},tap(){tone(520,.05,0,"square",.035)},win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,i*.11))}};
const confetti=(()=>{const c=$("#fx"),g=c.getContext("2d");let P=[],run=false;
 function step(){g.clearRect(0,0,c.width,c.height);P=P.filter(p=>p.y<innerHeight+20);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.13;p.a+=.2;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-5,-4,10,8);g.restore()});if(P.length)requestAnimationFrame(step);else{run=false;g.clearRect(0,0,c.width,c.height)}}
 return()=>{if(reduced)return;c.width=innerWidth;c.height=innerHeight;const COL=G.confetti;for(let i=0;i<130;i++)P.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*12-2,a:Math.random()*6,c:COL[i%COL.length]});if(!run){run=true;step()}}})();
const star=on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="${on?"var(--star)":"var(--star-off)"}" stroke="var(--line)" stroke-width="1.4" stroke-linejoin="round" d="M12 2l3 6.6 7.2.8-5.4 4.8 1.5 7.1L12 17.7l-6.3 3.6 1.5-7.1L1.8 9.4 9 8.6z"/></svg>`;
const masc=(m="happy",cl="")=>`<div class="masc ${cl}">${G.mascot(m)}</div>`;

/* ficheiros */
async function saveFile(name,data,type){const blob=data instanceof Blob?data:new Blob([data],{type:type||"text/plain;charset=utf-8"});
 try{if(window.claude&&window.claude.use){const d=await window.claude.use("downloads");if(d){await d.save({filename:name,data:blob});return true}}}catch(e){return false}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);return true}
async function copyTo(text,btn,box){try{await navigator.clipboard.writeText(text);const o=btn.textContent;btn.textContent="Copiado!";setTimeout(()=>btn.textContent=o,1500)}catch(e){const r=document.createRange();r.selectNodeContents(box);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="Agora carrega em Ctrl+C"}}
const safeName=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"")||"equipa";

/* códigos para o professor */
const EP=Date.UTC(2026,0,1);
function hash(s){let h=0x811c9dc5;for(const ch of s+G.salt){h^=ch.codePointAt(0);h=Math.imul(h,0x01000193)}return (h>>>0).toString(36).padStart(7,"0").slice(-5).toUpperCase()}
const b64=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,"_").replace(/\//g,"~").replace(/=+$/,"");
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/_/g,"+").replace(/~/g,"/")),c=>c.charCodeAt(0)));
const members=t=>(t.members||[]).filter(m=>!m.out);
const memLabel=(t,m)=>m.n+(m.t&&m.t!==(t.turma||"")?` (${m.t})`:"");
const idsNames=(t,ids)=>[...ids].map(id=>{const m=(t.members||[]).find(x=>x.id===id);return m?memLabel(t,m):"?"}).join(", ");
const playedIn=(t,th)=>{const ids=new Set(),acts=new Set(th?th.acts.map(a=>a.id):allActs.map(a=>a.id));t.log.forEach(l=>{if(acts.has(l.a)&&l.m)[...l.m].forEach(c=>ids.add(c))});return ids};
function makeCode(t){const ix=Object.fromEntries(allActs.map((a,i)=>[a.id,i]));
 const o={i:t.id,n:tidy(t.name),t:tidy(t.turma||""),c:t.ic,o:t.col,s:allActs.map(a=>t.best[a.id]??null),a:allActs.map(a=>t.att[a.id]||0),
  m:(t.members||[]).map(m=>[m.id,tidy(m.n),tidy(m.t||""),m.out?1:0]),
  l:(()=>{const L=t.log.filter(l=>l.a in ix),keep=new Set(L.slice(-90));allActs.forEach(a=>{const f=L.find(l=>l.a===a.id);if(f)keep.add(f)});return L.filter(l=>keep.has(l))})().map(l=>[ix[l.a],l.p,Math.max(0,Math.round((l.t-EP)/60000)),l.m||"",l.x||0])};
 const p=b64(JSON.stringify(o));return `${G.code}.${p}.${hash(p)}`}
const codeRe=()=>new RegExp(G.code.replace(".","\\.")+"\\.[A-Za-z0-9_~]+\\.[A-Z0-9]{5}","g");
function readCode(code){const m=code.trim().match(new RegExp("^"+G.code+"\\.([A-Za-z0-9_~]+)\\.([A-Z0-9]{5})$"));if(!m||hash(m[1])!==m[2])return null;
 try{const o=JSON.parse(unb64(m[1])),t={id:String(o.i),name:String(o.n),turma:String(o.t||""),ic:+o.c||0,col:+o.o||0,best:{},att:{},log:[],members:[]};
  allActs.forEach((a,i)=>{const v=o.s[i];if(v!=null){if(!(v>=0&&v<=100))throw 0;t.best[a.id]=+v}if(o.a[i])t.att[a.id]=+o.a[i]||0});
  (o.m||[]).forEach(x=>t.members.push({id:String(x[0]),n:String(x[1]),t:String(x[2]||""),out:!!x[3]}));
  (o.l||[]).forEach(x=>{if(allActs[x[0]]&&x[1]>=0&&x[1]<=100)t.log.push({a:allActs[x[0]].id,p:+x[1],t:EP+x[2]*60000,m:String(x[3]||""),...(x[4]?{x:+x[4]}:{})})});return t}catch(e){return null}}
function mergeTeam(list,t){let o=list.find(x=>x.id===t.id);if(!o){o={...t,best:{...t.best},att:{...t.att},log:t.log.map(l=>({...l})),members:(t.members||[]).map(m=>({...m})),got:Date.now()};list.push(o);return"nova"}
 Object.assign(o,{name:t.name,turma:t.turma,ic:t.ic,col:t.col,got:Date.now()});for(const k in t.best)o.best[k]=Math.max(o.best[k]??0,t.best[k]);for(const k in t.att)o.att[k]=Math.max(o.att[k]||0,t.att[k]);
 if(t.members&&t.members.length){o.members=o.members||[];t.members.forEach(m=>{const e=o.members.find(x=>x.id===m.id);if(e)Object.assign(e,m);else o.members.push({...m})})}
 const K=l=>l.a+"|"+Math.round(l.t/60000)+"|"+l.p+"|"+(l.m||"")+"|"+(l.x||0),cnt=new Map();o.log.forEach(l=>cnt.set(K(l),(cnt.get(K(l))||0)+1));const inc=new Map();t.log.forEach(l=>{const k=K(l);inc.set(k,(inc.get(k)||0)+1);if(inc.get(k)>(cnt.get(k)||0))o.log.push({...l})});o.log.sort((a,b)=>a.t-b.t);return"atualizada"}

/* ---------- ecrãs ---------- */
const badge=(t,c="")=>`<span class="tb ${c}" style="background:${G.tcols[t.col]||G.tcols[0]}">${G.ticons[t.ic]||G.ticons[0]}</span>`;
function bar(backFn,backLabel){const t=team();
 topbar.innerHTML=`<button class="brand" id="home" aria-label="Ir para o início">${G.short}</button>${backFn?`<button class="ghost" id="back">${backLabel}</button>`:""}<span class="sp"></span>${examOn()?'<span class="exb">Avaliação</span>':""}${t?`<button class="tmb" id="tmb" aria-label="Mudar de equipa">${badge(t,"s")}<span>${escH(t.name)}</span></button><span class="score" aria-label="${totalPts()} pontos">${star(true)}${totalPts()}</span>`:""}<button class="ghost" id="snd" aria-pressed="${S.sound}">${S.sound?"Som sim":"Som não"}</button>`;
 $("#home").onclick=goHome;if(backFn)$("#back").onclick=backFn;if($("#tmb"))$("#tmb").onclick=()=>goTeams();
 $("#snd").onclick=()=>{S.sound=!S.sound;save();$("#snd").textContent=S.sound?"Som sim":"Som não";$("#snd").setAttribute("aria-pressed",S.sound)};
}
const turmasLocais=()=>[...new Set(S.teams.map(t=>t.turma||""))].sort((a,b)=>a.localeCompare(b,"pt",{numeric:true}));
function goTeams(){clearAll();S.current=S.current&&team()?S.current:null;bar();view.scrollTop=0;
 const ts=turmasLocais();if(ts.length===1)S.curTurma=ts[0];if(S.curTurma!=null&&!ts.includes(S.curTurma))S.curTurma=null;
 const sel=S.curTurma,list=sel==null?[]:S.teams.filter(t=>(t.turma||"")===sel),tName=x=>x||"Sem turma";
 view.innerHTML=`<div class="wrap narrow2"><div class="hero">${masc("happy")}<div class="ht">${G.logo}<p class="lead">${G.hello} ${ts.length>1?"Primeiro escolham a vossa turma.":"Escolham a vossa equipa para começar."}</p></div></div>
 ${S.teams.length?`<div class="stage"><b class="fl" style="font-size:20px">Qual é a vossa turma?</b><div class="chips">${ts.map(x=>`<button class="chip" data-tu="${escH(x)}" aria-pressed="${x===sel}">${escH(tName(x))}</button>`).join("")}<button class="chip" id="otra">Outra turma</button></div></div>`:""}
 <div class="stage">${!S.teams.length?'<p class="q">Ainda não há equipas neste computador.</p>':sel==null?'<p class="q">Escolham a turma para verem as vossas equipas.</p>':`<h2 class="ttl3">Equipas da turma ${escH(tName(sel))}</h2>${list.map(t=>`<div class="trow">${badge(t)}<div class="grow"><b>${escH(t.name)}</b><span>${t.turma?escH(t.turma)+" · ":""}${Object.values(t.best).reduce((a,b)=>a+b,0)} pontos</span></div><span class="row" style="gap:6px"><button class="btn white small" data-ed="${t.id}">Elementos</button><button class="btn small" data-t="${t.id}">Jogar</button></span>${members(t).length?`<span class="mlist">${members(t).map(m=>escH(memLabel(t,m))).join(" · ")}</span>`:""}</div>`).join("")}`}
 <div class="row" style="justify-content:flex-start"><button class="btn" id="new">${sel?`Criar equipa na turma ${escH(sel)}`:"Criar equipa"}</button></div></div>

  if(k>0)say(cfg.prompt||cfg.intro);if(cfg.mount)cfg.mount(it);const inp=$("#ans");inp.focus({preventScroll:true});
  $("#tf").onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;
   if(cfg.check(it,v)){sfx.ok();marks[k]=tries?0.5:1;pts+=tries?.5:1;inp.disabled=true;$("#tf .btn").disabled=true;
    say(`${praise()} ${cfg.why(it)}`,"right",k<n-1?"Continuar":"Ver os pontos",()=>{k++;if(k<n)show();else finish(act,pts/n*100,`${marks.filter(x=>x===1).length} de ${n} à primeira.`)})}

 show()}

function fParse(src,V){let s=String(src).trim();if(s[0]!=="=")return{err:"eq"};
 s=s.slice(1).toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g,"");if(!s)return{err:"sint"};
 let i=0,refs=0;const fns=new Set();const FN={SOMA:a=>a.reduce((x,y)=>x+y,0),MEDIA:a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN,MAXIMO:a=>Math.max(...a),MINIMO:a=>Math.min(...a),MAX:a=>Math.max(...a),MIN:a=>Math.min(...a)};
 const ALIAS={MAX:"MAXIMO",MIN:"MINIMO"};

 function arg(){const save=i,a=refAt();if(a&&s[i]===":"){i++;const b=refAt();if(!b)fail("sint");const out=[];for(let r=Math.min(a.r,b.r);r<=Math.max(a.r,b.r);r++)for(let c=Math.min(a.c,b.c);c<=Math.max(a.c,b.c);c++){const v=V[COLS[c]+r];if(typeof v==="number")out.push(v)}return out}
  if(a){i=save;refs--}return [expr()]}
 function factor(){if(s[i]==="-"){i++;return -factor()}if(s[i]==="+"){i++;return factor()}
  if(s[i]==="("){i++;const v=expr();if(s[i]!==")")fail("sint");i++;return v}
  const n=s.slice(i).match(/^\d+(\.\d+)?/);if(n){i+=n[0].length;return parseFloat(n[0])}
  const f=s.slice(i).match(/^([A-Z]{2,})\(/);if(f){const name=f[1];if(!FN[name])fail("fn:"+name);fns.add(ALIAS[name]||name);i+=f[0].length;let all=[];if(s[i]!==")"){all=all.concat(arg());while(s[i]===";"||s[i]===","){i++;all=all.concat(arg())}}if(s[i]!==")")fail("sint");i++;return FN[name](all)}

 try{const v=expr();if(i<s.length)fail("sint");return{v,refs,fns}}catch(e){return{err:e.message}}}
