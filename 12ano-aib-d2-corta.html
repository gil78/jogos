html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:16.5px;line-height:1.5;overflow:hidden}
#fxbg{position:fixed;inset:0;width:100%;height:100%;display:block}
#fxtop{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:50}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--hud);color:var(--hud-fg)}
#hud[hidden]{display:none}
.hud-team{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 150px}
.hud-team b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.hud-pts{font-family:var(--f-m);white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--hud-acc)}
.hud-nav{display:flex;gap:6px;flex-wrap:wrap}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:20px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.narrow{max-width:640px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--f-d)}
p{margin:0}
.eyebrow{font-family:var(--f-m);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--eyebrow)}
.lead{max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{position:relative;background:var(--panel);color:var(--panel-fg);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel .muted{color:var(--panel-muted)}
.btn{font-family:var(--f-b);font-weight:700;font-size:16px;line-height:1.15;color:var(--acc-fg);background:var(--acc);border:0;padding:11px 18px;cursor:pointer;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px)}
.btn.alt{background:var(--alt);color:var(--alt-fg)}
.btn.mini{padding:6px 11px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--field-fg);background:var(--field);border:2px solid var(--line);padding:9px 11px;width:100%;min-width:0}
textarea{font-family:var(--f-m);font-size:14px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--acc)}
.lv-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.lv-score{font-family:var(--f-m);font-size:28px;line-height:1;font-variant-numeric:tabular-nums;color:var(--score)}
.lv-score small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;color:var(--muted)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--dot);border:2px solid var(--line)}
.dots i.ok{background:var(--ok);border-color:var(--ok)}
.dots i.no{background:var(--no);border-color:var(--no)}
.dots i.cur{border-color:var(--acc);background:var(--acc)}
.timer{height:9px;background:var(--dot);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--acc)}
.q{font-family:var(--f-b);font-weight:700;font-size:clamp(19px,2.6vw,24px);line-height:1.28}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.opts.two{grid-template-columns:minmax(0,1fr)}}
.opt{font:inherit;font-weight:600;color:var(--opt-fg);background:var(--opt);border:2px solid var(--line);padding:11px 13px;cursor:pointer;text-align:left;min-height:50px;transition:transform .08s,background .12s}
.opt:hover:not([disabled]){border-color:var(--acc)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--no-soft);border-color:var(--no)}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.opt[disabled]{cursor:default}
.fb{padding:12px 14px;border:2px solid;display:flex;flex-direction:column;gap:9px;background:var(--fb-bg);color:var(--panel-fg)}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.no{border-color:var(--no);background:var(--no-soft)}
.fb b{font-weight:800}
.split{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px}
@media (max-width:780px){.split{grid-template-columns:minmax(0,1fr)}}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:700;white-space:nowrap}
.code{font-family:var(--f-m);font-size:13px;word-break:break-all;background:var(--field);color:var(--field-fg);border:2px dashed var(--line);padding:9px 11px;user-select:all}
ul.learn{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;max-width:70ch}
.big{font-family:var(--f-d);font-size:clamp(60px,12vw,108px);line-height:1;font-variant-numeric:tabular-nums;color:var(--score)}
.bstars{display:flex;gap:6px}
.bstars svg{width:clamp(38px,7vw,58px);height:clamp(38px,7vw,58px);animation:kpop .4s cubic-bezier(.3,1.6,.5,1) backwards}
.bstars svg:nth-child(2){animation-delay:.15s}
.bstars svg:nth-child(3){animation-delay:.3s}
@keyframes kpop{from{transform:scale(0)}}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars svg{width:15px;height:15px}
.emb{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;color:#14181f;border:2px solid currentColor}
.emb.s{width:28px;height:28px}
.emb svg{width:64%;height:64%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pick-grid{display:flex;gap:9px;flex-wrap:wrap}
.pick-it{background:none;border:3px solid transparent;border-radius:50%;padding:3px;cursor:pointer;color:inherit}
.pick-it[aria-pressed=true]{border-color:var(--acc)}
.swatch{display:block;width:36px;height:36px;border-radius:50%;border:2px solid #14181f}
.teamrow{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;align-items:end}
.ped{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.ped .nm{font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.ped .pts{font-family:var(--f-m);font-variant-numeric:tabular-nums}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function zipStore(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 for(const f of files){const nm=enc.encode(f.name),d=enc.encode(f.data),crc=crc32(d),h=new DataView(new ArrayBuffer(30));

  cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length}
 const size=cd.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,size,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}
const xe=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const colL=n=>{let s="";n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};

function buildXlsx(list){const sheets=[],Ld=(t,i)=>{const v=lastT(t,i);return v?fmtD(v)+" "+fmtH(v):""},LV=GAME.levels;
 const MK=["best","first","mean","exam"];
