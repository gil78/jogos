html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:16.5px;line-height:1.5;overflow:hidden}
#fxbg{position:fixed;inset:0;width:100%;height:100%;display:block}
#fxtop{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:50}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--hud);color:var(--hud-fg)}
#hud[hidden]{display:none}
.hud-team{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 150px}
.hud-team b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.hud-pts{font-family:var(--f-m);white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--hud-acc)}
.hud-nav{display:flex;gap:6px;flex-wrap:wrap}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:20px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.narrow{max-width:640px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--f-d)}
p{margin:0}
.eyebrow{font-family:var(--f-m);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--eyebrow)}
.lead{max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{position:relative;background:var(--panel);color:var(--panel-fg);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel .muted{color:var(--panel-muted)}
.btn{font-family:var(--f-b);font-weight:700;font-size:16px;line-height:1.15;color:var(--acc-fg);background:var(--acc);border:0;padding:11px 18px;cursor:pointer;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px)}
.btn.alt{background:var(--alt);color:var(--alt-fg)}
.btn.mini{padding:6px 11px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--field-fg);background:var(--field);border:2px solid var(--line);padding:9px 11px;width:100%;min-width:0}
textarea{font-family:var(--f-m);font-size:14px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--acc)}
.lv-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.lv-score{font-family:var(--f-m);font-size:28px;line-height:1;font-variant-numeric:tabular-nums;color:var(--score)}
.lv-score small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;color:var(--muted)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--dot);border:2px solid var(--line)}
.dots i.ok{background:var(--ok);border-color:var(--ok)}
.dots i.no{background:var(--no);border-color:var(--no)}
.dots i.cur{border-color:var(--acc);background:var(--acc)}
.timer{height:9px;background:var(--dot);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--acc)}
.q{font-family:var(--f-b);font-weight:700;font-size:clamp(19px,2.6vw,24px);line-height:1.28}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.opts.two{grid-template-columns:minmax(0,1fr)}}
.opt{font:inherit;font-weight:600;color:var(--opt-fg);background:var(--opt);border:2px solid var(--line);padding:11px 13px;cursor:pointer;text-align:left;min-height:50px;transition:transform .08s,background .12s}
.opt:hover:not([disabled]){border-color:var(--acc)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--no-soft);border-color:var(--no)}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.opt[disabled]{cursor:default}
.fb{padding:12px 14px;border:2px solid;display:flex;flex-direction:column;gap:9px;background:var(--fb-bg);color:var(--panel-fg)}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.no{border-color:var(--no);background:var(--no-soft)}
.fb b{font-weight:800}
.split{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px}
@media (max-width:780px){.split{grid-template-columns:minmax(0,1fr)}}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:700;white-space:nowrap}
.code{font-family:var(--f-m);font-size:13px;word-break:break-all;background:var(--field);color:var(--field-fg);border:2px dashed var(--line);padding:9px 11px;user-select:all}
ul.learn{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;max-width:70ch}
.big{font-family:var(--f-d);font-size:clamp(60px,12vw,108px);line-height:1;font-variant-numeric:tabular-nums;color:var(--score)}
.bstars{display:flex;gap:6px}
.bstars svg{width:clamp(38px,7vw,58px);height:clamp(38px,7vw,58px);animation:kpop .4s cubic-bezier(.3,1.6,.5,1) backwards}
.bstars svg:nth-child(2){animation-delay:.15s}
.bstars svg:nth-child(3){animation-delay:.3s}
@keyframes kpop{from{transform:scale(0)}}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars svg{width:15px;height:15px}
.emb{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;color:#14181f;border:2px solid currentColor}
.emb.s{width:28px;height:28px}
.emb svg{width:64%;height:64%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pick-grid{display:flex;gap:9px;flex-wrap:wrap}
.pick-it{background:none;border:3px solid transparent;border-radius:50%;padding:3px;cursor:pointer;color:inherit}
.pick-it[aria-pressed=true]{border-color:var(--acc)}
.swatch{display:block;width:36px;height:36px;border-radius:50%;border:2px solid #14181f}
.teamrow{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;align-items:end}
.ped{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.ped .nm{font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.ped .pts{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.ped .bar{width:100%;display:flex;justify-content:center;padding-top:8px;font-family:var(--f-d);color:var(--acc-fg);background:var(--acc);animation:kgrow .6s cubic-bezier(.2,.9,.3,1) backwards}
.ped.p1 .bar{height:150px;font-size:50px}
.ped.p2 .bar{height:105px;font-size:38px;opacity:.82}
.ped.p3 .bar{height:75px;font-size:32px;opacity:.65}
@keyframes kgrow{from{height:0}}
.src{font-family:var(--f-m);font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.7}
.rank td:nth-child(2),.rank th:nth-child(2){text-align:left}
.guide{display:flex;flex-direction:column;gap:10px}
.guide article{border-top:1px solid var(--line);padding-top:9px;display:flex;flex-direction:column;gap:2px}
.empty{padding:20px;text-align:center;border:2px dashed var(--line)}
.shake{animation:kshake .32s}
@keyframes kshake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tok{font:inherit;font-weight:600;color:var(--opt-fg);background:var(--opt);border:2px solid var(--line);padding:7px 11px;cursor:pointer}
.tok:hover:not([disabled]){border-color:var(--acc)}
.tok[disabled]{opacity:.35;cursor:default}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* equipas com turma e elementos, área do professor */
.kchips,.ktabs{display:flex;gap:7px;flex-wrap:wrap}
.kchip{font:inherit;font-weight:700;font-size:15px;color:var(--opt-fg);background:var(--opt);border:2px solid var(--line);padding:5px 12px;cursor:pointer;border-radius:30px}
.kchip:hover{border-color:var(--acc)}
.kchip[aria-pressed=true]{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.kmlist{display:flex;flex-direction:column;gap:8px}
.kmrow{display:grid;grid-template-columns:28px minmax(0,2fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.kmi{width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--acc-fg);display:grid;place-items:center;font-weight:700;font-size:14px}
@media (max-width:520px){.kmrow{grid-template-columns:28px minmax(0,1fr) 90px}.kmrow .btn{grid-column:2/-1;justify-self:start}}
.ksplit{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.ksplit{grid-template-columns:minmax(0,1fr)}}
table.ktab td.wr{white-space:normal;min-width:140px;font-size:13.5px}
table.ktab td{white-space:nowrap}
table.ktab tr.pick{cursor:pointer}
table.ktab tr.pick:hover td{background:var(--opt)}
table.ktab tr.sel td{background:var(--ok-soft);color:var(--panel-fg)}
.kpath{border:2px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.kmem{display:flex;flex-wrap:wrap;gap:6px}.kmem span{border:1px solid var(--line);padding:3px 9px;font-size:14px}.kmem span.off{opacity:.5}
ol.ktl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ol.ktl li{display:grid;grid-template-columns:130px minmax(0,1fr) minmax(60px,160px) 44px;gap:10px;align-items:center;font-size:14.5px}
@media (max-width:620px){ol.ktl li{grid-template-columns:minmax(0,1fr) 70px 40px}ol.ktl li>span:first-child{grid-column:1/-1}}
.kbar{display:block;height:10px;background:var(--dot);overflow:hidden}.kbar i{display:block;height:100%;background:var(--acc)}

/* modo avaliação */
.kexam{background:#fff3c4;color:#3a2a00;border:2px solid #d99a00;padding:10px 14px;font-weight:700;font-size:15.5px}
.kexb{display:inline-flex;align-items:center;background:#d99a00;color:#1a1200;font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;white-space:nowrap}
.kexb.s{font-size:10.5px;padding:1px 6px}
.kkey{display:flex;flex-direction:column;gap:4px;align-items:flex-start;background:#fff3c4;color:#3a2a00;border:3px dashed #d99a00;padding:12px 16px}
.kkey span{font-weight:700;font-size:14.5px}
.kkey b{font-family:var(--f-m);font-size:clamp(32px,6vw,50px);letter-spacing:.12em;line-height:1.1}
/* Marte.py: centro de controlo dos anos 70 em Marte; emblemas de missão bordados e consola de bordo */
:root{color-scheme:dark;
 --bg:#10343a;--fg:#fbf0dc;--hud:#0b2429;--hud-fg:#fbf0dc;--hud-acc:#f6b73c;
 --panel:#fbf0dc;--panel-fg:#20302f;--panel-muted:#6a6a58;--muted:#cfe0d6;--eyebrow:#f6b73c;
 --acc:#e4572e;--acc-fg:#fff;--alt:#17505a;--alt-fg:#fbf0dc;--focus:#2ec4b6;
 --field:#fffaf0;--field-fg:#20302f;--line:#c9b99a;--score:#f6b73c;--dot:#e5d7bc;
 --ok:#148f77;--no:#c8321f;--ok-soft:#d3efe5;--no-soft:#fadcd5;--fb-bg:#fff;--opt:#fffaf0;--opt-fg:#20302f;

const KA="23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
const dayN=()=>{const d=new Date();return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,0,1))/864e5)};
const kEnc=n=>[Math.floor(n/1024)%32,Math.floor(n/32)%32,n%32].map(i=>KA[i]).join("");
const kChk=b=>{const h=hash("exam:"+b);return KA[parseInt(h.slice(0,2),36)%32]+KA[parseInt(h.slice(2,4),36)%32]};
function makeKey(max){const b=kEnc(dayN()*3+(max-1));return "AV-"+b+kChk(b)}
function readKey(k){const v=String(k).toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/^AV/,"").replace(/0/g,"O");if(v.length!==5||[...v].some(c=>!KA.includes(c)))return null;const b=v.slice(0,3);if(kChk(b)!==v.slice(3))return null;const n=b.split("").reduce((a,c)=>a*32+KA.indexOf(c),0);return{id:n,day:Math.floor(n/3),max:n%3+1}}
const exOf=t=>{t=t||team();return t&&t.ex&&t.ex.day===dayN()?t.ex:null};

}

 <div class="col"><b>Guardar e exportar</b><div class="row" style="gap:6px"><button class="btn mini" id="xl" ${P.length?"":"disabled"}>Exportar para Excel</button><button class="btn alt mini" id="tsv" ${P.length?"":"disabled"}>Copiar tabela</button><button class="btn alt mini" id="bk" ${P.length?"":"disabled"}>Guardar cópia de segurança</button><label class="btn alt mini" for="rf" style="cursor:pointer">Abrir cópia</label><input type="file" id="rf" accept=".json,application/json" hidden></div><p class="small muted">O Excel tem uma folha de resumo, uma de elementos, uma por nível e o percurso completo.</p></div></div><textarea id="tsvbox" hidden aria-label="Tabela de resultados"></textarea><p id="msg" class="small" role="status" style="font-weight:700"></p></div>
 <div class="panel"><div class="row between"><div class="ktabs">${tabs.map(([k,n])=>`<button class="kchip" data-k="${k}" aria-pressed="${PV.tab===k}">${n}</button>`).join("")}</div><span class="row" style="gap:10px"><label class="small"><b>Pontuação</b> <select id="mt" style="width:auto;display:inline-block;padding:5px 9px">${Object.entries(MET).map(([k,n])=>`<option value="${k}" ${PV.met===k?"selected":""}>${n}</option>`).join("")}</select></label><label class="small"><b>Turma</b> <select id="tu" style="width:auto;display:inline-block;padding:5px 9px"><option value="">Todas</option>${turmas.filter(Boolean).map(x=>`<option ${x===PV.turma?"selected":""}>${esc(x)}</option>`).join("")}</select></label></span></div>${body}</div>
 <div class="panel"><h3>Chave de avaliação</h3><p class="small">Para uma aula de avaliação, crie a chave de hoje e escreva-a no quadro. Cada equipa escreve a chave no seu computador, no botão Avaliação, e passa a ter um número limitado de tentativas em cada nível. As equipas que não escreverem a chave continuam em treino. A chave só vale hoje e só neste jogo. Em avaliação, os treinos feitos antes não descontam pontos.</p><div class="row"><label class="small"><b>Tentativas por nível</b> <select id="exm" style="width:auto;display:inline-block;padding:5px 9px">${[1,2,3].map(n=>`<option ${S.keyMax===n?"selected":""}>${n}</option>`).join("")}</select></label><button class="btn mini" id="mk">Criar a chave de hoje</button></div><div id="kbox"></div><p class="small muted">Para ver só as tentativas feitas com chave, escolha Pontuação: Avaliação.</p></div>
 <div class="panel"><h3>Equipas neste computador</h3>${S.teams.length?`<div class="row"><button class="btn mini" id="loc">Juntar as equipas deste computador aos resultados</button></div>${turmasLocais().map(tu=>`<div class="row between" style="border-top:1px solid var(--line);padding-top:8px"><b>Turma ${esc(tName(tu))} · ${S.teams.filter(t=>(t.turma||"")===tu).length} equipa${S.teams.filter(t=>(t.turma||"")===tu).length===1?"":"s"}</b><span><button class="btn alt mini" data-delt="${esc(tu)}">Apagar as equipas desta turma</button></span></div>`).join("")}${S.teams.slice().sort((a,b)=>(a.turma||"").localeCompare(b.turma||"","pt",{numeric:true})).map(t=>`<div class="teamrow">${emblem(t,true)}<div class="grow"><b>${esc(t.name)}</b><div class="small muted">${t.turma?esc(t.turma)+" · ":""}${total(t)} pontos${members(t).length?" · "+esc(members(t).map(m=>m.n).join(", ")):""}</div></div><span id="lt${t.id}"><button class="btn alt mini" data-del="${t.id}">Apagar</button></span></div>`).join("")}`:'<p class="small muted">Não há equipas neste computador.</p>'}<p class="small muted">Quando uma turma acaba a aula, junte as equipas aos resultados e apague-as. A turma seguinte cria as suas equipas no mesmo computador.</p></div>
 <div class="panel"><h3>Definições da aula</h3><div class="row between"><div class="grow"><b>Abrir todos os níveis</b><p class="small muted">Para trabalhar um nível específico numa aula.</p></div><button class="btn alt mini" id="unl" aria-pressed="${S.unlock}">${S.unlock?"Abertos":"Por ordem"}</button></div><div class="row between"><div class="grow"><b>Apagar os resultados recebidos</b><p class="small muted">Guarde antes uma cópia de segurança.</p></div><span id="wb"><button class="btn alt mini" id="wipe" ${P.length?"":"disabled"}>Apagar resultados</button></span></div><div class="row between"><div class="grow"><b>Apagar tudo deste jogo neste computador</b><p class="small muted">Equipas, pontuações, resultados recebidos e PIN.</p></div><span id="wipeBox"><button class="btn alt mini" id="wall">Apagar tudo</button></span></div><div class="row"><button class="btn alt mini" id="out">Sair da área do professor</button></div><p class="small muted">Os resultados ficam guardados neste browser. Use a cópia de segurança para os passar para outro computador.</p></div>
 <div class="panel"><h3>Guia dos níveis</h3><p class="small muted">Tempos estimados, com debate. Cada nível vale até 1000 pontos. Repetir um nível reduz o máximo em 15% por tentativa, até 50%. Conta a melhor marca.</p><div class="guide">${GAME.levels.map((L,i)=>`<article><span class="eyebrow">Nível ${i+1} · cerca de ${L.min} min</span><b>${esc(L.t)}: ${esc(L.c)}</b><span class="small"><span class="muted">Pergunta para debate:</span> ${esc(L.q)}</span></article>`).join("")}</div><p class="small muted">${GAME.note}</p></div></div>`;
 const msg=t=>$("#msg").textContent=t,stamp=()=>new Date().toISOString().slice(0,10);
 const take2=txt=>{const ls=txt.match(/[A-Z0-9]+\.[A-Za-z0-9_~]+\.[A-Z0-9]{5}/g)||[];let n=0,u=0,bad=0,other=0;ls.forEach(l=>{const r=readCode(l);if(r.err==="modulo"){other++;return}if(r.err){bad++;return}mergeTeam(S.imported,r.t)==="nova"?n++:u++});save();return{n,u,bad,other,tot:ls.length}};
 const report=r=>{if(!r.tot){msg("Não foi encontrado nenhum código.");return}teacherMain();msg([r.n?`${r.n} equipa${r.n>1?"s":""} nova${r.n>1?"s":""}.`:"",r.u?`${r.u} equipa${r.u>1?"s":""} atualizada${r.u>1?"s":""}.`:"",r.other?`${r.other} código${r.other>1?"s":""} de outro jogo.`:"",r.bad?`${r.bad} código${r.bad>1?"s":""} com erro: peçam à equipa para o copiar outra vez.`:""].filter(Boolean).join(" "))};
 $("#add").onclick=()=>report(take2($("#codes").value));
 $("#ff").onchange=async e=>{let txt="";for(const f of e.target.files)txt+="\n"+await f.text();report(take2(txt))};
 $("#rf").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=="tic10-prof-"+GAME.id||!Array.isArray(d.teams))throw 0;let n=0;d.teams.forEach(t=>{if(t&&t.id&&Array.isArray(t.scores)){mergeTeam(S.imported,fixT(t));n++}});save();teacherMain();msg(`Cópia aberta: ${n} equipa${n===1?"":"s"}.`)}catch(x){msg(`Este ficheiro não é uma cópia de segurança de ${GAME.title}.`)}};
 $("#bk").onclick=async()=>{const ok=await saveFile(`${GAME.id}_copia_${stamp()}.json`,JSON.stringify({app:"tic10-prof-"+GAME.id,v:2,saved:Date.now(),teams:S.imported}),"application/json");msg(ok?"Cópia de segurança guardada.":"A cópia não foi guardada.")};
 $("#xl").onclick=async()=>{const ok=await saveFile(`${GAME.id}_resultados${PV.turma?"_"+PV.turma.replace(/[^A-Za-z0-9]+/g,""):""}_${stamp()}.xlsx`,buildXlsx(shownTeams()));msg(ok?`Ficheiro Excel criado com ${shownTeams().length} equipa${shownTeams().length===1?"":"s"}.`:"O ficheiro não foi guardado.")};
 $("#tsv").onclick=()=>{const b=$("#tsvbox");b.hidden=false;b.value=[["Equipa","Turma","Elementos",...GAME.levels.map((_,i)=>"N"+(i+1)),"Total"],...shownTeams().map(t=>[t.name,t.turma||"",members(t).map(m=>memLabel(t,m)).join(", "),...t.scores.map(v=>v??""),total(t)])].map(r=>r.join("\t")).join("\n");b.select();copyTo(b.value,$("#tsv"),b)};
 $$("[data-k]").forEach(b=>b.onclick=()=>{PV.tab=b.dataset.k;PV.sel=null;teacherMain()});
 $("#tu").onchange=e=>{PV.turma=e.target.value;PV.sel=null;teacherMain()};
 $("#mt").onchange=e=>{PV.met=e.target.value;teacherMain()};
 const showKey=()=>{$("#kbox").innerHTML=`<div class="kkey"><span>Chave de hoje, ${fmtD(Date.now())}, com ${S.keyMax===1?"1 tentativa":S.keyMax+" tentativas"} por nível</span><b id="kv">${makeKey(S.keyMax)}</b></div>`};
 $("#exm").onchange=e=>{S.keyMax=+e.target.value;save();if($("#kv"))showKey()};
 $("#mk").onclick=()=>{showKey();sfx.tap()};
 $$("tr.pick").forEach(r=>{const f=()=>{PV.sel=PV.sel===r.dataset.id?null:r.dataset.id;teacherMain();const p=$(".kpath");if(p)p.scrollIntoView({block:"nearest"})};r.onclick=f;r.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
 if($("#rm"))$("#rm").onclick=()=>{$("#rmb").innerHTML='<span class="small"><b>Remover dos resultados recebidos?</b></span> <button class="btn mini" id="y">Sim, remover</button> <button class="btn alt mini" id="n">Não</button>';$("#y").onclick=()=>{S.imported=S.imported.filter(t=>t.id!==PV.sel);PV.sel=null;save();teacherMain()};$("#n").onclick=teacherMain};
 if($("#loc"))$("#loc").onclick=()=>{let n=0,u=0;S.teams.forEach(t=>mergeTeam(S.imported,JSON.parse(JSON.stringify(t)))==="nova"?n++:u++);save();teacherMain();msg(`${n} nova${n===1?"":"s"}, ${u} atualizada${u===1?"":"s"}.`)};
 $$("[data-delt]").forEach(b=>b.onclick=()=>{const tu=b.dataset.delt,box=b.parentElement;box.innerHTML='<span class="small"><b>Junte primeiro as equipas aos resultados. Apagar mesmo?</b></span> <button class="btn mini" data-yt>Sim, apagar</button>';$("[data-yt]",box).onclick=()=>{S.teams=S.teams.filter(t=>(t.turma||"")!==tu);if(!team())S.current=null;if(S.curTurma===tu)S.curTurma=null;save();teacherMain()}});
 $$("[data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del;$("#lt"+id).innerHTML=`<button class="btn mini" data-y="${id}">Apagar mesmo</button>`;$(`[data-y="${id}"]`).onclick=()=>{S.teams=S.teams.filter(t=>t.id!==id);if(S.current===id)S.current=null;save();teacherMain()}});
 $("#unl").onclick=()=>{S.unlock=!S.unlock;save();$("#unl").textContent=S.unlock?"Abertos":"Por ordem";$("#unl").setAttribute("aria-pressed",S.unlock)};
 $("#wipe").onclick=()=>{$("#wb").innerHTML='<span class="small"><b>Tem a certeza?</b></span> <button class="btn mini" id="y">Sim, apagar</button> <button class="btn alt mini" id="n">Não</button>';$("#y").onclick=()=>{S.imported=[];PV.sel=null;save();teacherMain()};$("#n").onclick=teacherMain};
 $("#wall").onclick=()=>{$("#wipeBox").innerHTML='<span class="small"><b>Apaga mesmo tudo. Tem a certeza?</b></span> <button class="btn mini" id="y2">Sim, apagar</button> <button class="btn alt mini" id="n2">Não</button>';$("#y2").onclick=()=>{S.teams=[];S.imported=[];S.current=null;S.unlock=false;S.pin=null;profOk=false;save();goStart()};$("#n2").onclick=teacherMain};
 $("#out").onclick=()=>{profOk=false;team()?goHub():goStart()};
}

/* ficheiro Excel (.xlsx) criado no browser */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function zipStore(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 for(const f of files){const nm=enc.encode(f.name),d=enc.encode(f.data),crc=crc32(d),h=new DataView(new ArrayBuffer(30));
  [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,0,2],[12,0x21,2],[14,crc,4],[18,d.length,4],[22,d.length,4],[26,nm.length,2],[28,0,2]].forEach(([o,v,s])=>s===4?h.setUint32(o,v,true):h.setUint16(o,v,true));
  parts.push(new Uint8Array(h.buffer),nm,d);const c=new DataView(new ArrayBuffer(46));
  [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,0,2],[14,0x21,2],[16,crc,4],[20,d.length,4],[24,d.length,4],[28,nm.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,off,4]].forEach(([o,v,s])=>s===4?c.setUint32(o,v,true):c.setUint16(o,v,true));
  cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length}
 const size=cd.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,size,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}
const xe=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const colL=n=>{let s="";n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
function sheetXml(rows,widths){const r=rows.map((row,y)=>`<row r="${y+1}">${row.map((v,x)=>{const ref=colL(x)+(y+1),st=y===0?' s="1"':"";if(v===null||v===undefined||v==="")return `<c r="${ref}"${st}/>`;if(typeof v==="number")return `<c r="${ref}"${st}><v>${v}</v></c>`;return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xe(v)}</t></is></c>`}).join("")}</row>`).join("");
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${r}</sheetData></worksheet>`}
function buildXlsx(list){const sheets=[],Ld=(t,i)=>{const v=lastT(t,i);return v?fmtD(v)+" "+fmtH(v):""},LV=GAME.levels;
 const MK=["best","first","mean","exam"];
 sheets.push(["Resumo",[["Equipa","Turma","Elementos",...LV.map((L,i)=>`N${i+1} ${L.t} (melhor)`),...MK.map(k=>"Total: "+MET[k].toLowerCase()),"Níveis concluídos","Tentativas","Tentativas em avaliação","Título","Última atividade"],...list.map(t=>[t.name,t.turma||"",members(t).map(m=>memLabel(t,m)).join(", "),...t.scores.map(v=>v??""),...MK.map(k=>mTotal(t,k)),doneCount(t),t.log.length,t.log.filter(l=>l.x).length,rankName(total(t)),Ld(t)])],[24,10,36,...LV.map(()=>16),16,16,16,16,10,11,12,18,18]]);
 const er=[["Equipa","Turma da equipa","Elemento","Turma do elemento",...LV.map((_,i)=>`N${i+1} (tentativas)`),"Total de tentativas"]];
 list.forEach(t=>(t.members||[]).filter(m=>!m.out||t.log.some(l=>(l.m||"").includes(m.id))).forEach(m=>{const c=LV.map((_,i)=>t.log.filter(l=>l.l===i&&(l.m||"").includes(m.id)).length);er.push([t.name,t.turma||"",m.n+(m.out?" (saiu da equipa)":""),m.t||t.turma||"",...c,c.reduce((a,b)=>a+b,0)])}));
 sheets.push(["Elementos",er,[24,12,22,14,...LV.map(()=>14),14]]);
 LV.forEach((L,i)=>sheets.push([`N${i+1} ${L.t}`.replace(/[\[\]:*?\/\\]/g," ").slice(0,31),[["Equipa","Turma","Elementos que jogaram","Melhor pontuação","Estrelas","1.ª tentativa","Média das tentativas","Avaliação","Tentativas","Tentativas em avaliação","Última vez"],...list.map(t=>[t.name,t.turma||"",idsNames(t,playedIn(t,i)),t.scores[i]??"",t.scores[i]==null?"":starsOf(t.scores[i]),metric(t,i,"first")??"",metric(t,i,"mean")??"",metric(t,i,"exam")??"",t.att[i]||0,tries(t,i).filter(l=>l.x).length,Ld(t,i)])],[24,10,36,16,9,13,14,11,11,13,18]]));
 const pr=[["Equipa","Turma","Nível","Título do nível","Elementos","Pontos","Modo","N.º da tentativa","Data","Hora"]];list.forEach(t=>{const nn={};t.log.forEach(l=>{const L=LV[l.l];nn[l.l]=(nn[l.l]||0)+1;if(L)pr.push([t.name,t.turma||"",`N${l.l+1}`,L.t,l.m?idsNames(t,l.m):"",l.p,l.x?"Avaliação":"Treino",nn[l.l],fmtD(l.t),fmtH(l.t)])})});
 sheets.push(["Percurso",pr,[24,10,8,28,36,9,11,10,12,8]]);
 const files=[{name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`},
 {name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
 {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xe(s[0])}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`},
 {name:"xl/_rels/workbook.xml.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
 {name:"xl/styles.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF2B3445"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},
 ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:sheetXml(s[1],s[2])}))];
 return zipStore(files)}
if(GAME.init)GAME.init();goStart();
